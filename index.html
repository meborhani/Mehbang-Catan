<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کارخانه داتیس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column. Header + era rail, player strip, status line, an expanding hex board, log, sticky action dock.
   One committed dark look (deep-space indigo, ember accent), so no light theme. */
:root{
  --void:#0A0F14; --deep:#0E151C; --panel:#131C25; --panel-2:#1C2833; --line:#32465A;
  --ink:#E8EEF4; --ink-dim:#8FA2B4; --ember:#FFB000; --ember-ink:#1A1000;
  --e0:#F2D94E; --e1:#E8663F; --e2:#4ED39B; --e3:#46C6EE; --e4:#B08CF0;
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-body:'Vazirmatn',Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  direction:rtl;font-family:var(--font-body);font-size:14px;line-height:1.55;
  background-color:var(--void);color:var(--ink);
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(120% 60% at 50% -10%,#1d2c3a 0%,transparent 62%);
  background-size:28px 28px,28px 28px,auto;
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button:disabled{cursor:default}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{display:inline-block;vertical-align:middle;flex:none}

.wrap{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 0;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-size:28px;line-height:1}
.brand small{display:block;font-family:var(--font-body);font-size:11px;color:var(--ink-dim);letter-spacing:.04em;margin-top:2px}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-dim);text-align:left}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.help{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:700}

.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-dim)}
.seg i{display:block;height:4px;border-radius:2px;background:var(--panel-2)}
.seg.done i{background:#6b8299}
.seg.now i{background:var(--ember);box-shadow:0 0 10px color-mix(in srgb,var(--ember) 53%,transparent)}
.seg.now{color:var(--ink);font-weight:700}

.pls{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-width:0;position:relative}
.pl.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 16px color-mix(in srgb,var(--ember) 27%,transparent)}
.pl-top{display:flex;align-items:center;gap:6px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 2px #0006}
.nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pt{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.pl-pt small{font-family:var(--font-body);font-size:10px;color:var(--ink-dim);margin-inline-start:3px}
.pl-sub{font-size:10.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;min-height:16px}
.tags span{font-size:9.5px;padding:0 5px;border-radius:8px;background:color-mix(in srgb,var(--ember) 15%,transparent);color:var(--ember);white-space:nowrap}

.status{display:flex;align-items:center;gap:8px;min-height:40px}
.msg{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.msg.hint{color:var(--ember);font-weight:700}
.dice{display:flex;gap:5px;align-items:center}
.die{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#0b1219;display:grid;place-items:center;font-weight:700;font-size:16px}
.die.roll{animation:wob .2s linear infinite}
.dsum{font-size:12px;color:var(--ink-dim);min-width:18px;text-align:center}

.board{position:relative;border:1px solid #22313f;border-radius:18px;background:radial-gradient(70% 60% at 50% 50%,#16212b 0%,#0b1219 100%);overflow:hidden}
.board svg{display:block;width:100%;height:auto;max-height:62dvh;touch-action:manipulation}
.board.big{overflow:auto;-webkit-overflow-scrolling:touch}
.board.big svg{width:155%;max-height:none}
.ghost{fill:none;stroke:#44586b;stroke-width:.03;stroke-dasharray:.1 .12;opacity:.55}
.tile polygon{stroke-width:.045;stroke-opacity:.9}
.tile.hot polygon{stroke:#fff !important;stroke-width:.09;animation:pulse 1.1s ease-in-out infinite}
.tile.sel{cursor:pointer}
.tile.sel polygon{stroke:#fff !important;stroke-width:.08;stroke-dasharray:.18 .1;animation:dash 1s linear infinite}
.tile.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.tile.flip{animation:flip .8s ease-in-out;transform-box:fill-box;transform-origin:center}
.hl{fill:var(--ember);fill-opacity:.28;stroke:var(--ember);stroke-width:.04;animation:pulse 1.1s ease-in-out infinite}
.hlE{stroke:var(--ember);stroke-width:.13;stroke-linecap:round;stroke-opacity:.6;animation:pulse 1.1s ease-in-out infinite}
.hit{cursor:pointer}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.ntext{font-family:var(--font-body);font-weight:700;font-variant-numeric:tabular-nums}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-dim);min-height:68px}
.log li:first-child{color:var(--ink)}
.log li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dock{position:sticky;bottom:0;margin-top:auto;z-index:5;display:flex;flex-direction:column;gap:7px;
  padding-top:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--void) 72%,transparent)}
.spec{text-align:center;color:var(--ink-dim);padding:14px 0}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rc{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.rc b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums}
.rc{min-width:0}
.rc span{font-size:9px;color:var(--ink-dim);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.row2{display:flex;gap:6px}
.row2 .btn{flex:1;padding:8px 2px;font-size:12px}
.row2 .btn.primary{flex:2}
.bld{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bb{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;padding:7px 2px 6px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);font-size:11.5px;font-weight:500;min-width:0}
.bb:disabled{opacity:.36}
.cost{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;font-weight:500;min-height:42px}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);font-weight:700}
.btn.primary:disabled{opacity:.4}
.btn:disabled{opacity:.4}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn.wide{width:100%}

#layer{position:relative;z-index:80}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(4,7,10,.76);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(560px,100%);max-height:none;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.sheet h3{margin:0;font-family:var(--font-display);font-size:24px;font-weight:400;line-height:1.2}
.sheet p{margin:0}
.sub{color:var(--ink-dim);font-size:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;flex-direction:column;gap:6px}
.pk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--panel-2);border-radius:12px}
.pk-h{display:flex;align-items:center;gap:8px;min-width:0}
.pk-h small{color:var(--ink-dim);font-size:11px}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:22px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.sbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
.sbtn:disabled{opacity:.3}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);font-size:11px}
.cb b{font-size:15px}
.cb.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.cb:disabled{opacity:.3}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel-2);border-radius:12px}
.crow p{color:var(--ink-dim);font-size:12.5px}
.crow small{color:var(--ember)}
.cnt{color:var(--ink-dim)}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#d3dde8}
.rules b{color:var(--ink)}
.costs{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.costs div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.costs em{font-style:normal;min-width:84px;color:var(--ink)}
.score{display:flex;flex-direction:column;gap:6px}
.score div{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel-2);border-radius:12px}
.score b{margin-inline-start:auto;font-family:var(--font-display);font-size:24px;font-weight:400}
.score .win{box-shadow:0 0 0 1px var(--ember);background:color-mix(in srgb,var(--ember) 22%,#0b1219)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:90;
  background:#fff;color:#0b1219;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;max-width:88vw;text-align:center;animation:rise .2s ease-out}

.era-card{align-items:center;text-align:center}
.era-big{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--ember);margin:4px 0}
.chain{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;color:var(--ink-dim)}

#intro{position:fixed;inset:0;z-index:60;overflow:auto;background-color:var(--void);
  background-image:radial-gradient(90% 50% at 50% 0%,#1f2d3a 0%,transparent 70%),radial-gradient(50% 30% at 50% 22%,color-mix(in srgb,var(--ember) 20%,transparent) 0%,transparent 100%)}
.intro-in{position:relative;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.rings{position:absolute;top:2%;left:50%;width:min(130vw,640px);height:min(130vw,640px);transform:translateX(-50%);pointer-events:none;z-index:0}
.rings circle{fill:none;stroke:var(--ember);stroke-width:1.2;transform-origin:50% 50%;transform-box:fill-box;animation:expand 7s ease-out infinite;opacity:0}
.rings circle:nth-child(2){animation-delay:1.75s}.rings circle:nth-child(3){animation-delay:3.5s}.rings circle:nth-child(4){animation-delay:5.25s}
.intro-in>*{position:relative;z-index:1}
.over{font-size:12px;color:var(--ember);letter-spacing:.06em;font-weight:700}
.hero{font-family:var(--font-display);font-weight:400;font-size:clamp(56px,18vw,88px);line-height:.95;margin:0;
  background:linear-gradient(180deg,#fff 5%,#ffc08a 55%,var(--ember) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--ember) 33%,transparent))}
.lead{margin:0;color:#d3dde8;font-size:15px}
.seg-n{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg-n button{padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.seg-n button.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember);background:color-mix(in srgb,var(--ember) 20%,#0b1219);font-weight:700}
.intro-in details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.intro-in summary{cursor:pointer;font-weight:700}
.intro-in details .rules{margin-top:10px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dash{to{stroke-dashoffset:-.56}}
@keyframes grow{from{opacity:0;transform:scale(.55)}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes wob{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
@keyframes expand{0%{transform:scale(.05);opacity:.8}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.cb small{color:var(--ember);font-size:10px}
.tc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;min-width:0}
.tc b{font-size:15px;line-height:1.1}
.tc span{white-space:nowrap;font-size:9.5px;color:var(--ink-dim);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pm{display:flex;gap:4px}
.pm button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;line-height:1;padding:0}
.pm button:disabled{opacity:.28}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.offer div{background:var(--panel-2);border-radius:12px;padding:10px;text-align:center;font-size:13px}

/* full-screen layout: everything fits one screen, the board takes all the free space */
html,body{height:100%}
body{overflow:hidden}
.wrap{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;max-width:760px;gap:6px;padding-block:4px 6px;overflow:hidden}
.top{gap:8px}
.brand{font-size:22px}.brand small{display:none}
.meta{font-size:12px}
.help{width:28px;height:28px;font-size:14px}
.pls{grid-template-columns:repeat(var(--n,4),1fr);gap:5px}
.pl{padding:4px 6px 3px;border-radius:10px}
.pl-top{gap:4px}
.nm{font-size:12px;flex:1;min-width:0}
.hc{display:flex;align-items:center;gap:2px;font-size:10px;color:var(--ink-dim);flex:none;margin-inline-start:auto;font-family:var(--font-body)}
.pl-pt{display:flex;align-items:baseline;gap:3px;font-size:21px;line-height:1.05;white-space:nowrap;overflow:hidden}
.pl-pt small{margin:0}
.pl-pt em{font-style:normal;font-family:var(--font-body);font-size:8.5px;color:var(--ember);background:color-mix(in srgb,var(--ember) 13%,transparent);border-radius:6px;padding:0 4px}
.dense .pl-pt small{display:none}.dense .nm{font-size:11px}
.status{min-height:30px;gap:6px}
.msg{font-size:12.5px;line-height:1.35}
.die{width:26px;height:26px;font-size:14px;border-radius:7px}
.stage{position:relative;flex:1;min-height:0;margin-left:-10px;margin-right:-10px}
.board,.board.big{position:absolute;inset:0;overflow:hidden;border-radius:14px;border-color:transparent}
.board svg,.board.big svg{position:absolute;inset:0;width:100%;height:100%;max-height:none}
.log{position:absolute;left:10px;right:10px;bottom:6px;margin:0;min-height:0;pointer-events:none;font-size:11.5px;text-shadow:0 1px 3px #000,0 0 6px #000}
.log li:first-child{color:var(--ink-dim)}
.log li:last-child{color:var(--ink)}
.dock{position:static;margin-top:0;padding:0;background:none;gap:5px}
.rowA{display:grid;grid-template-columns:repeat(5,1fr) 1.55fr;gap:5px}
.rowA .btn{min-height:0;padding:4px 2px;font-size:13px}
.rowC{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.rowC .btn{min-height:34px;padding:4px 2px;font-size:12.5px}
.rc{padding:4px 1px 3px}.rc b{font-size:15px;line-height:1.15}.rc span{font-size:8.5px}
.bld{gap:5px}.bb{padding:5px 2px 4px;font-size:11px;gap:2px}
.spec{padding:8px 0}

.online{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.inp{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;min-width:0;width:100%}
.inp.code{text-align:center;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.join{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px}
#lobby{position:fixed;inset:0;z-index:65;overflow:auto;background-color:var(--void);
  background-image:radial-gradient(90% 50% at 50% 0%,#1f2d3a 0%,transparent 70%)}
.lobby-code{font-family:var(--font-display);font-size:64px;line-height:1;letter-spacing:.14em;direction:ltr;text-align:center;color:var(--ember)}
.seats{display:flex;flex-direction:column;gap:6px}
.seat{padding:9px 12px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-dim)}
.seat.on{border-style:solid;border-color:var(--ember);color:var(--ink);background:color-mix(in srgb,var(--ember) 20%,#0b1219)}
.warn{color:#ff8a8a;margin:0}
.row{display:flex;justify-content:center}

html{overflow:hidden;overscroll-behavior:none}
html,body{margin:0;padding:0}
body{position:fixed;inset:0;width:100%}
#intro,#lobby{overflow:hidden;display:flex;align-items:center;justify-content:center}
#intro[hidden],#lobby[hidden]{display:none}
.intro-in{min-height:0 !important;width:min(520px,100%);gap:clamp(6px,1.5dvh,14px);justify-content:center;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.hero{font-size:clamp(40px,11dvh,84px) !important;line-height:1.2 !important;padding:2px 0 6px}
.lead{font-size:13.5px}
.ihead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{min-height:44px}
.btn.big{min-height:52px;font-size:17px}
.btn.sm{min-height:40px}
.online{padding:10px;gap:6px}
.join{grid-template-columns:1fr 1fr 64px}
.inp{min-height:40px;padding:8px 10px}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.help svg,.icon-btn svg{display:block}
.meta{gap:6px}
.hv{font-size:10px;color:var(--ink-dim);font-style:normal;white-space:nowrap}
.nn{font-size:10.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tc b{font-size:17px;background:color-mix(in srgb,var(--ember) 16%,transparent);border-radius:8px;padding:0 8px;min-width:30px;text-align:center}
.cb .hv{margin-top:1px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2)}
.th.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember);background:color-mix(in srgb,var(--ember) 14%,#0b1219)}
.thi{display:flex;gap:2px}

  var key=q+','+r,c=hexCenter(q,r);

function initBoard(){

function expand(){
  if(S.tiles.size>=19)return null;

  S.tiles.forEach(function(t){DIRS.forEach(function(d){
    var q=t.q+d[0],r=t.r+d[1],k=q+','+r;

    if(!cand.some(function(c){return c[2]===k;}))cand.push([q,r,k]);
  });});
  var best=[],bn=-1;
  cand.forEach(function(c){
    var n=0;DIRS.forEach(function(d){if(S.tiles.has((c[0]+d[0])+','+(c[1]+d[1])))n++;});
    if(n>bn){bn=n;best=[c];}else if(n===bn)best.push(c);

function count(p,t){

function totalPoints(p){

  if(S.longest===p.id)n+=2;

    var ba=S.bld.get(pt.a),bb=S.bld.get(pt.b);
    if(!((ba&&ba.o===p.id)||(bb&&bb.o===p.id)))return;
    if(pt.type<0)best=Math.min(best,3);else if(pt.type===r)best=Math.min(best,2);

    out.push(v.key);

function filSpots(p,fromV){

function longest(pid){
  var adj=new Map(),any=false;
  S.fil.forEach(function(o,ek){
    if(o!==pid)return;any=true;
    var e=S.edges.get(ek);
    [[e.a,e.b],[e.b,e.a]].forEach(function(x){if(!adj.has(x[0]))adj.set(x[0],[]);adj.get(x[0]).push({to:x[1],key:ek});});
  });
  if(!any)return 0;
  var best=0,used=new Set();
  function dfs(v,len){
    if(len>best)best=len;
    var b=S.bld.get(v);
    if(b&&b.o!==pid&&len>0)return;
    var list=adj.get(v)||[];
    for(var i=0;i<list.length;i++){
      var x=list[i];if(used.has(x.key))continue;
      used.add(x.key);dfs(x.to,len+1);used.delete(x.key);
    }
  }
  adj.forEach(function(_,v){dfs(v,0);});
  return best;
}
function updateAwards(){
  S.lens=S.players.map(function(p){return longest(p.id);});
  var mx=Math.max.apply(null,S.lens),old=S.longest;
  if(mx>=5){
    var c=[];S.lens.forEach(function(l,i){if(l===mx)c.push(i);});
    if(c.indexOf(S.longest)<0)S.longest=c.length===1?c[0]:null;
  }else S.longest=null;
  if(S.longest!==old&&S.longest!==null)log(S.players[S.longest].name+' بلندترین شبکه را دارد ('+fa(mx)+').');
  var dm=Math.max.apply(null,S.players.map(function(p){return p.played;})),od=S.dark;
  if(dm>=3){
    var d=[];S.players.forEach(function(p,i){if(p.played===dm)d.push(i);});
    if(d.indexOf(S.dark)<0)S.dark=d.length===1?d[0]:null;
  }else S.dark=null;
  if(S.dark!==od&&S.dark!==null)log(S.players[S.dark].name+' بزرگ‌ترین ارتش را دارد.');
}

/* ---------- sheets ---------- */
function openSheet(html,opt){
  closeSheet();
  var dismiss=!(opt&&opt.dismiss===false);
  var bd=document.createElement('div');bd.className='backdrop';
  var sh=document.createElement('div');sh.className='sheet'+((opt&&opt.cls)?' '+opt.cls:'');sh.innerHTML=html;
  bd.appendChild(sh);$('#layer').appendChild(bd);
  if(dismiss)bd.addEventListener('click',function(e){if(e.target===bd)closeSheet();});
  curSheet=bd;
  var q=0;
  function refit(){if(q)return;q=requestAnimationFrame(function(){q=0;fitSheet(sh);});}
  try{new MutationObserver(refit).observe(sh,{childList:true,subtree:true});}catch(e){}
  fitSheet(sh);
  return sh;
}
function fitSheet(sh){
  sh.style.zoom='';sh.style.width='';
  var maxH=window.innerHeight*0.95-8,h=sh.offsetHeight;
  if(h>maxH){
    var z=Math.max(0.5,maxH/h);
    sh.style.zoom=z;sh.style.width=(Math.min(560,window.innerWidth)/z)+'px';
  }
}
function fitBox(el,pad){
  if(!el)return;
  el.style.zoom='';el.style.width='';
  var maxH=window.innerHeight-(pad||0)-12,h=el.offsetHeight;
  if(h>maxH&&maxH>100){
    var z=Math.max(0.45,maxH/h);
    el.style.zoom=z;el.style.width=(Math.min(520,window.innerWidth)/z)+'px';
  }
}

  '<li><b>نقشه:</b> هر بازی نقشه‌ای تازه و تصادفی دارد: ۱۹ کاشی برای ۲ تا ۴ نفر و ۳۰ کاشی با ۲ کارگاه برای ۵ و ۶ نفر. «کارگاه» که قطعه‌ای تولید نمی‌کند هر بار جای دیگری می‌افتد و خرابی از یکی از آن‌ها شروع می‌کند. عدد ۶ و ۸ (نارنجی) بیشتر از بقیه می‌آیند.</li>'+

function doBuild(p,kind,key,free){
  if(kind==='fil'){if(!free)pay(p,COST.fil);S.fil.set(key,p.id);log(p.name+' کابل شبکه کشید.');}
  else if(kind==='star'){pay(p,COST.star);S.bld.set(key,{o:p.id,t:'star',planet:false});log(p.name+' یک درایو نصب کرد.');}
  else if(kind==='gal'){pay(p,COST.gal);S.bld.get(key).t='gal';log(p.name+' درایو را به تابلو فرمان ارتقا داد.');}
  else if(kind==='planet'){pay(p,COST.planet);S.bld.get(key).planet=true;log(p.name+' سیاره‌ای حیات‌بخش ساخت.');}
  updateAwards();render();checkWin();
}
function doNova(p,vk){
  var v=S.verts.get(vk);
  S.bld.delete(vk);p.novaUsed=true;p.res[4]+=3;
  var shared=0;
  v.tiles.forEach(function(tk){S.tiles.get(tk).vs.forEach(function(wk){var b=S.bld.get(wk);if(b){S.players[b.o].res[4]+=1;shared++;}});});
  log(p.name+' ابرنواختر کرد: ۳ عنصر سنگین برای خودش و '+fa(shared)+' برای ساخته‌های اطراف.');
  updateAwards();render();checkWin();
}
function buyCard(p){
  pay(p,COST.buy);
  var c=S.deck.pop();
  p.cards[c]++;p.fresh[c]=(p.fresh[c]||0)+1;
  log(p.name+' یک کارت برداشت.');
  toastTo(p,'کارت «'+CARD[c].n+'» را برداشتی');
  render();checkWin();
}
function playable(p,k){return k!=='fine'&&p.cards[k]-(p.fresh[k]||0)>0&&!p.playedCard;}
async function playCard(p,type,st){
  p.cards[type]--;p.playedCard=true;
  if(type==='gravity'){
    p.played++;log(p.name+' یک سرباز بازی کرد.');
    updateAwards();render();
    await moveBlackHole(p,st);
  }else if(type==='strong'){
    log(p.name+' ساخت راه را بازی کرد.');
    for(var i=0;i<2;i++){
      if(stale(st))return;
      if(count(p,'fil')>=LIM.fil)break;
      var sp=filSpots(p);if(!sp.length)break;
      var k=p.ai?aiPickFil(p,sp):await askSeat(p,'target',{kind:'edge',keys:sp,cancel:false,hint:'کابل رایگان '+fa(i+1)+' را انتخاب کن'});
      doBuild(p,'fil',k,true);
    }
  }else if(type==='em'){
    var pk=p.ai?aiNeeded(p,2):await askSeat(p,'pick',{title:'برکت: دو قطعهٔ دلخواه بردار',n:2,limit:null});
    pk.forEach(function(n,i){p.res[i]+=n;});
    log(p.name+' برکت را بازی کرد.');
  }else if(type==='planck'){
    var r=p.ai?aiPlanck(p):await askSeat(p,'choose',{title:'کدام قطعه را انحصاری می‌کنی؟',opts:RN.map(function(x,i){return {label:x,value:i};})});
    var got=0;
    S.players.forEach(function(q){if(q.id!==p.id){got+=q.res[r];q.res[r]=0;}});
    p.res[r]+=got;
    log(p.name+' با انحصار '+fa(got)+' '+RS[r]+' گرفت.');
  }
  render();checkWin();
}
async function moveBlackHole(p,st){
  var opts=[];S.tiles.forEach(function(t,k){if(k!==S.bh)opts.push(k);});
  var k=p.ai?aiBHTile(p,opts):await askSeat(p,'target',{kind:'tile',keys:opts,cancel:false,hint:'خرابی را به کدام کاشی می‌بری؟'});
  S.fxId=(S.fxId||0)+1;S.fxTile=k;playFx(k);scheduleSyncNow();
  await sleep(700);
  if(stale(st))return;
  S.bh=k;log(p.name+' خرابی را به کاشی دیگری برد.');render();
  await sleep(1400);
  if(stale(st))return;
  var t=S.tiles.get(k),vic=new Set();
  t.vs.forEach(function(vk){var b=S.bld.get(vk);if(b&&b.o!==p.id&&sum(S.players[b.o].res)>0)vic.add(b.o);});
  if(!vic.size)return;
  var vid,list=Array.from(vic);
  if(list.length===1)vid=list[0];
  else if(p.ai)vid=list.sort(function(a,b){return publicPoints(S.players[b])-publicPoints(S.players[a]);})[0];
  else vid=await askSeat(p,'choose',{title:'از چه کسی می‌دزدی؟',opts:list.map(function(id){return {label:S.players[id].name,value:id};})});
  var v=S.players[vid],pool=[];
  v.res.forEach(function(n,i){for(var j=0;j<n;j++)pool.push(i);});
  var r=pick(pool);v.res[r]--;p.res[r]++;
  log(p.name+' یک قطعه از '+v.name+' دزدید.');toastTo(p,'دزدیدی: '+RS[r]);toastTo(v,p.name+' یک '+RS[r]+' از تو دزدید');
  render();
}

/* ---------- AI ---------- */
function pips(n){return n?6-Math.abs(7-n):0;}
function vertexScore(vk){
  var v=S.verts.get(vk),s=0,seen=new Set();
  v.tiles.forEach(function(tk){
    var t=S.tiles.get(tk);if(t.slot<0)return;
    s+=pips(t.num)*(S.bh===tk?0.3:1);seen.add(tileRes(t));
  });
  return s+seen.size*1.8+(v.tiles.length===3?0.5:0)+(S.portAt&&S.portAt.has(vk)?1.2:0);
}
function bestOf(arr,fn){
  var b=null,bs=-1e9;
  arr.forEach(function(x){var s=fn(x)+Math.random()*AK().noise;if(s>bs){bs=s;b=x;}});
  return b;
}
function aiSetupStar(p){return bestOf(starSpots(p,true),vertexScore);}
function aiSetupFil(p,vk){
  var sp=filSpots(p,vk);
  return bestOf(sp,function(ek){
    var e=S.edges.get(ek),o=e.a===vk?e.b:e.a,ok=!S.bld.has(o),adjB=false;
    S.verts.get(o).adj.forEach(function(n){if(S.bld.has(n))adjB=true;});
    return (ok&&!adjB)?vertexScore(o):1;
  });
}
function aiPickFil(p,spots){
  return bestOf(spots,function(ek){
    var e=S.edges.get(ek),best=0;
    [e.a,e.b].forEach(function(vk){
      if(S.bld.has(vk))return;
      var adjB=false;S.verts.get(vk).adj.forEach(function(n){if(S.bld.has(n))adjB=true;});
      var sc=adjB?vertexScore(vk)*0.15:vertexScore(vk)+3;
      if(sc>best)best=sc;
    });
    return best;
  });
}
function aiGoal(p){
  var stars=count(p,'star');
  if(stars<LIM.star&&starSpots(p,false).length)return COST.star;
  if(stars>0&&count(p,'gal')<LIM.gal)return COST.gal;
  return COST.buy;
}
function aiNeeded(p,n){
  var goal=aiGoal(p),need=goal.map(function(x,i){return Math.max(0,x-p.res[i]);}),out=[0,0,0,0,0];
  for(var k=0;k<n;k++){
    var i=argmax(need);
    if(need[i]<=0)i=rint(5);
    out[i]++;need[i]=Math.max(0,need[i]-1);
  }
  return out;
}
function aiPlanck(p){
  var best=0,bs=-1;
  for(var r=0;r<5;r++){var t=0;S.players.forEach(function(q){if(q.id!==p.id)t+=q.res[r];});if(t>bs){bs=t;best=r;}}
  return best;
}
function aiBHTile(p,opts){
  if(S.diff===0&&Math.random()<.4)return pick(opts);
  return bestOf(opts,function(tk){
    var t=S.tiles.get(tk),sc=0;
    if(t.slot<0)return -5;
    t.vs.forEach(function(vk){
      var b=S.bld.get(vk);if(!b)return;
      var w=pips(t.num)*(b.t==='gal'?2:1);
      sc+=b.o===p.id?-w*1.6:w*(1+AK().bh*publicPoints(S.players[b.o])/12);
    });
    return sc;
  });
}
function aiTrade(p){
  var goal=aiGoal(p),want=-1,i;
  for(i=0;i<5;i++)if(goal[i]>p.res[i]){want=i;break;}
  if(want<0)return false;
  var best=-1,br=9;
  for(var j=0;j<5;j++){
    var r=ratio(p,j);
    if(j!==want&&p.res[j]-goal[j]>=r&&r<br){br=r;best=j;}
  }
  if(best<0)return false;
  p.res[best]-=br;p.res[want]++;
  log(p.name+' '+fa(br)+' '+RS[best]+' را برون‌سپاری کرد و یک '+RS[want]+' گرفت.');
  render();return true;
}
function aiAccepts(q,give,get,h){
  var gi=sum(give),go=sum(get),i;
  if(gi<1||go<1)return false;
  for(i=0;i<5;i++){if(q.res[i]<get[i])return false;if(give[i]>0&&get[i]>0)return false;}
  if(totalPoints(h)>=WIN-(S.diff===2?4:2))return false;
  var goal=aiGoal(q),useful=false;
  for(i=0;i<5;i++){if(get[i]>0&&q.res[i]-get[i]<goal[i])return false;if(give[i]>0&&q.res[i]<goal[i])useful=true;}
  if(S.diff!==0&&!((gi>=go&&useful)||gi>go))return false;
  return rint(10)<9;
}
async function aiOffer(p){
  var humans=S.players.filter(function(q){return !q.ai;});
  if(!humans.length||S.phase!=='play')return false;
  var h=pick(humans),i,goal=aiGoal(p),want=-1,give=-1;
  for(i=0;i<5;i++)if(goal[i]>p.res[i]){want=i;break;}
  if(want<0||h.res[want]<1)return false;
  for(i=0;i<5;i++)if(i!==want&&p.res[i]-goal[i]>=1){give=i;break;}
  if(give<0)return false;
  var yes=await askSeat(h,'offer',{name:p.name,want:want,give:give},30000);
  if(yes&&h.res[want]>=1&&p.res[give]>=1){
    h.res[want]--;p.res[want]++;p.res[give]--;h.res[give]++;
    log(h.name+' با '+p.name+' معامله کرد.');render();return true;
  }
  return false;
}

function aiCard(p){
  var kinds=['gravity','strong','em','planck'];
  for(var i=0;i<kinds.length;i++){
    var k=kinds[i];
    if(!playable(p,k))continue;
    if(k==='strong'&&(count(p,'fil')>LIM.fil-2||filSpots(p).length<1))continue;
    if(k==='planck'){var r=aiPlanck(p),t=0;S.players.forEach(function(q){if(q.id!==p.id)t+=q.res[r];});if(t<3)continue;}
    if(k==='em'&&sum(p.res)>8)continue;
    return k;
  }
  return null;
}
async function aiAct(p,st){
  if(Math.random()>AK().act)return false;
  var stars=count(p,'star'),gals=count(p,'gal'),fils=count(p,'fil');
  var ss=starSpots(p,false);
  if(stars<LIM.star&&ss.length&&canPay(p,COST.star)){doBuild(p,'star',bestOf(ss,vertexScore));return true;}
  if(gals<LIM.gal&&stars>0&&canPay(p,COST.gal)){
    var mine=[];S.bld.forEach(function(b,vk){if(b.o===p.id&&b.t==='star')mine.push(vk);});
    doBuild(p,'gal',bestOf(mine,vertexScore));return true;
  }
  if(S.deck.length&&canPay(p,COST.buy)&&Math.random()<AK().card){buyCard(p);return true;}
  var ck=aiCard(p);
  if(ck&&Math.random()<AK().card){await playCard(p,ck,st);return true;}
  if(fils<LIM.fil&&canPay(p,COST.fil)&&(ss.length===0||sum(p.res)>=7)){
    var sp=filSpots(p);
    if(sp.length){doBuild(p,'fil',aiPickFil(p,sp));return true;}
  }
  if(Math.random()<AK().trade&&aiTrade(p))return true;
  return false;
}
async function aiTurn(p,st){
  await sleep(450);
  if(stale(st))return;
  await rollAndResolve(p,st);
  if(!stale(st)&&rint(100)<AK().offer)await aiOffer(p);
  for(var i=0;i<14;i++){
    if(stale(st))return;
    await sleep(520);
    if(stale(st))return;
    var did=await aiAct(p,st);
    if(!did)break;
  }
  if(!stale(st))await sleep(250);
}

/* ---------- turn flow ---------- */
function produce(n){
  S.hotNum=n;
  var gain=S.players.map(function(){return [0,0,0,0,0];}),blocked=false;
  S.tiles.forEach(function(t){
    if(t.num!==n||t.slot<0)return;
    if(S.bh===t.key){blocked=true;return;}
    var r=tileRes(t);
    t.vs.forEach(function(vk){var b=S.bld.get(vk);if(b)gain[b.o][r]+=b.t==='gal'?2:1;});
  });
  var any=false;
  S.players.forEach(function(p,i){
    var g=gain[i];
    if(sum(g)){any=true;g.forEach(function(c,k){p.res[k]+=c;});
      log(p.name+': '+g.map(function(c,k){return c?'+'+fa(c)+' '+RS[k]:'';}).filter(Boolean).join('، '));}
  });
  if(!any)log(blocked?'خرابی جلوی تولید را گرفت.':'این بار کسی چیزی نگرفت.');
}
async function handleSeven(p,st){
  S.hotNum=null;
  log('قطعی برق! هر کس بیش از ۷ قطعه دارد نیمی را از دست می‌دهد.');
  for(var i=0;i<S.players.length;i++){
    var q=S.players[i],tot=sum(q.res);
    if(tot>7){
      var n=Math.floor(tot/2);
      if(q.ai){for(var k=0;k<n;k++)q.res[argmax(q.res)]--;}
      else{
        var d=await askSeat(q,'pick',{title:'قطعی برق: '+fa(n)+' قطعه را کنار بگذار',n:n,limit:q.res.slice()},timerOn()?40000:0);
        d.forEach(function(c,j){q.res[j]-=c;});
      }
      log(q.name+' '+fa(n)+' قطعه را از دست داد.');
    }
  }
  render();
  if(stale(st))return;
  await moveBlackHole(p,st);
}
async function rollAndResolve(p,st){
  for(var i=0;i<5;i++){S.dice=[1+rint(6),1+rint(6)];S.rolling=true;renderStatus();if(ROLE==='host')scheduleSync();await sleep(70);}
  S.rolling=false;
  var d1=1+rint(6),d2=1+rint(6),n=d1+d2;
  S.dice=[d1,d2];
  log(p.name+' تاس ریخت: '+fa(n));
  if(n===7)await handleSeven(p,st);else produce(n);
  render();
}
async function entropyStep(p,st){
  if(S.era<2)return;
  var tot=sum(p.res);
  if(!tot){log('آشفتگی: '+p.name+' چیزی برای از دست دادن ندارد.');return;}
  if(p.ai){var i=argmax(p.res);p.res[i]--;log('آشفتگی از '+p.name+' یک '+RS[i]+' گرفت.');}
  else{
    var d=await pickResources({title:'آشفتگی: یک منبع را رها کن',n:1,limit:p.res});
    d.forEach(function(c,j){p.res[j]-=c;});
    log('آشفتگی از تو یک منبع گرفت.');
  }
  S.entropy++;render();
}
var TMR=null;
function timerOn(){return ROLE==='host'&&!!S&&S.players.some(function(q){return q.remote;});}
function limitFor(p){return p.idle>=1?30:60;}
function tScale(){return window.__TSCALE||1;}
function armTimer(p,st,sec){
  clearTimeout(TMR);
  var ms=(sec||limitFor(p))*1000*tScale();
  S.tEnd=Date.now()+ms;
  TMR=setTimeout(function(){onTimeout(p,st);},ms);
  scheduleSync();
}
function disarmTimer(){clearTimeout(TMR);TMR=null;if(S){S.tEnd=0;S.tmo=false;}}
function onTimeout(p,st){
  if(stale(st)||S.cur!==p.id)return;
  S.tmo=true;
  log(p.name+': وقتش تمام شد.');
  NET.pending.forEach(function(pd){if(pd.seat===p.id){toSeat(p.id,{t:'closeAsk',id:pd.id});pd.fin(defaultAnswer(pd.kind,pd.payload));}});
  var lp=NET.localPend;
  if(lp&&!p.remote){NET.localPend=null;cancelLocal();lp.res(defaultAnswer(lp.kind,lp.payload));}
  else if(!p.remote&&(S.sel||curSheet)){cancelLocal();}
  if(S.waitRoll){var f=S.waitRoll;S.waitRoll=null;f();}
  if(S.waitEnd){var g=S.waitEnd;S.waitEnd=null;g();}
}
function cancelLocal(){if(S&&S.sel)S.sel=null;closeSheet();render();}
function strikeCheck(p){
  if(p.acted){p.idle=0;return;}
  p.idle++;
  if(p.idle>=2&&p.remote){kickPlayer(p);return;}
  log(p.name+' در این نوبت هیچ کاری نکرد.');
  toastTo(p,'اخطار! نوبت بعدی فقط ۳۰ ثانیه وقت داری. اگر دوباره کاری نکنی از بازی حذف می‌شوی.');
}
function kickPlayer(p){
  var seat=p.id,l=NET.links[seat];
  log(p.name+' به‌خاطر بی‌تحرکی از بازی حذف شد و هوش مصنوعی جایش را گرفت.');
  toSeat(seat,{t:'kicked'});
  p.ai=true;p.remote=false;NET.links[seat]=null;
  if(l){l.onclose=null;setTimeout(function(){l.close();},400);}
  NET.pending.forEach(function(pd){if(pd.seat===seat)pd.fin(defaultAnswer(pd.kind,pd.payload));});
}
async function turn(p,st){
  S.cur=p.id;p.fresh={};p.playedCard=false;p.novaUsed=false;S.hotNum=null;S.mode='idle';S.busy=false;
  render();
  await sleep(300);
  if(stale(st))return;
  await entropyStep(p,st);
  if(stale(st))return;
  if(p.ai){await aiTurn(p,st);}
  else{
    var tOn=timerOn();
    p.acted=false;S.tmo=false;
    if(tOn)armTimer(p,st);
    S.mode='needRoll';render();
    await new Promise(function(r){S.waitRoll=r;});
    if(stale(st)){disarmTimer();return;}
    if(p.ai){disarmTimer();await aiTurn(p,st);S.mode='idle';return;}
    S.mode='idle';S.busy=true;render();
    await rollAndResolve(p,st);
    S.busy=false;
    if(stale(st)){disarmTimer();return;}
    if(!S.tmo&&!p.ai){S.mode='actions';render();await new Promise(function(r){S.waitEnd=r;});}
    if(tOn&&!stale(st))strikeCheck(p);
    disarmTimer();
  }
  S.mode='idle';
}
async function endRound(st){
  S.round++;
  if(S.round>60){
    var best=S.players.slice().sort(function(a,b){return totalPoints(b)-totalPoints(a);})[0];
    S.over=true;S.winner=best.id;render();showEnd();return;
  }
  render();
  await sleep(300);
}
async function setupPhase(st){
  var N=S.players.length,ord=[];
  for(var i=0;i<N;i++)ord.push(i);
  var seq=ord.concat(ord.slice().reverse());
  S.phase='setup';
  for(var s=0;s<seq.length;s++){
    if(stale(st))return;
    var p=S.players[seq[s]],second=s>=N;
    S.cur=p.id;S.mode='idle';render();
    var vk,ek,sTmr=timerOn()&&!p.ai,sMs=sTmr?limitFor(p)*1000*tScale():0;
    if(sTmr){p.timedOut=false;S.tEnd=Date.now()+sMs;scheduleSync();}
    if(p.ai){await sleep(380);vk=aiSetupStar(p);}
    else vk=await askSeat(p,'target',{kind:'vertex',keys:starSpots(p,true),cancel:false,hint:(second?'درایو دوم':'درایو نخست')+' را روی یکی از نقطه‌های روشن نصب کن'},sMs);
    if(stale(st))return;
    S.bld.set(vk,{o:p.id,t:'star',planet:false});
    if(second)S.verts.get(vk).tiles.forEach(function(tk){var t=S.tiles.get(tk),r=tileRes(t);if(r>=0)p.res[r]++;});
    render();
    if(sTmr){S.tEnd=Date.now()+sMs;scheduleSync();}
    if(p.ai){await sleep(280);ek=aiSetupFil(p,vk);}
    else ek=await askSeat(p,'target',{kind:'edge',keys:filSpots(p,vk),cancel:false,hint:'یک کابل شبکه کنار درایو بکش'},sMs);
    if(stale(st))return;
    if(sTmr){S.tEnd=0;p.acted=!p.timedOut;strikeCheck(p);}
    S.fil.set(ek,p.id);
    updateAwards();render();
    log(p.name+' '+(second?'درایو دوم':'درایو نخست')+' و یک کابل شبکه را گذاشت.');
    await sleep(200);
  }
  S.phase='play';
}
async function mainLoop(st){
  await setupPhase(st);
  if(stale(st))return;
  log('بازی شروع شد. موفق باشی!');
  while(!stale(st)){
    for(var i=0;i<S.players.length;i++){
      if(stale(st))return;
      await turn(S.players[i],st);
    }
    if(stale(st))return;
    await endRound(st);
  }
}
function checkWin(){
  if(S.over)return true;
  var p=S.players[S.cur];
  if(p&&S.phase==='play'&&totalPoints(p)>=WIN){
    S.over=true;S.winner=p.id;S.sel=null;
    var a=S.waitEnd,b=S.waitRoll;S.waitEnd=null;S.waitRoll=null;
    render();
    if(a)a();if(b)b();
    setTimeout(showEnd,window.__FAST?0:700);
    return true;
  }
  return false;
}

/* ---------- human actions ---------- */
async function actFor(p,fn,pre){
  if(!p||S.cur!==p.id||S.busy||S.over||!(S.mode==='actions'||(pre&&S.mode==='needRoll')))return;
  S.busy=true;render();
  try{await fn();}catch(e){console.error(e);}
  finally{S.busy=false;if(!S.over)render();}
}
function canDo(p,kind){
  if(kind==='fil')return canPay(p,COST.fil)&&count(p,'fil')<LIM.fil&&filSpots(p).length>0;
  if(kind==='star')return canPay(p,COST.star)&&count(p,'star')<LIM.star&&starSpots(p,false).length>0;
  if(kind==='gal')return canPay(p,COST.gal)&&count(p,'gal')<LIM.gal&&count(p,'star')>0;
  if(kind==='buy')return canPay(p,COST.buy)&&S.deck.length>0;
  return false;
}
async function hBuild(p,kind){
  if(!canDo(p,kind))return;
  if(kind==='buy'){buyCard(p);return;}
  var keys=[],hint='',kk='vertex';
  if(kind==='fil'){keys=filSpots(p);hint='مسیر کابل شبکه را انتخاب کن';kk='edge';}
  else if(kind==='star'){keys=starSpots(p,false);hint='جای درایو را انتخاب کن';}
  else if(kind==='gal'){S.bld.forEach(function(b,vk){if(b.o===p.id&&b.t==='star')keys.push(vk);});hint='کدام درایو به تابلو فرمان ارتقا یابد؟';}
  else return;
  var k=await askSeat(p,'target',{kind:kk,keys:keys,cancel:true,hint:hint});
  if(k&&canDo(p,kind))doBuild(p,kind,k,false);
}
function doBank(p,give,get){
  give=+give;get=+get;
  if(!(give>=0&&give<5&&get>=0&&get<5&&give!==get&&give%1===0&&get%1===0))return;
  var r=ratio(p,give);
  if(p.res[give]<r)return;
  p.res[give]-=r;p.res[get]++;
  log(p.name+' '+fa(r)+' '+RS[give]+' را برون‌سپاری کرد و یک '+RS[get]+' گرفت.');
  render();
}
function cleanArr(a){
  if(!Array.isArray(a)||a.length!==5)return null;
  return a.map(function(x){x=Math.floor(+x);return (x>0&&x<10)?x:0;});
}
function collectTradeResponses(p,give,get){
  return Promise.all(S.players.filter(function(q){return q.id!==p.id;}).map(function(q){
    if(q.ai)return Promise.resolve({id:q.id,ok:aiAccepts(q,give,get,p)});
    for(var i=0;i<5;i++)if(q.res[i]<get[i])return Promise.resolve({id:q.id,ok:false});
    return askSeat(q,'tradeOffer',{from:p.name,give:give,get:get},25000).then(function(v){return {id:q.id,ok:!!v};});
  }));
}
function deliverTradeResult(p,results){
  if(p.remote)toSeat(p.id,{t:'ptradeResult',results:results});
  else if(NET.onTradeResult)NET.onTradeResult(results);
}
async function ptradePropose(p,give,get){
  if(S.cur!==p.id||S.mode!=='actions'||S.busy||S.over)return;
  give=cleanArr(give);get=cleanArr(get);
  if(!give||!get||sum(give)<1||sum(get)<1)return;
  for(var i=0;i<5;i++){if(give[i]>p.res[i]||(give[i]>0&&get[i]>0))return;}
  S.busy=true;render();
  var results=[];
  try{results=await collectTradeResponses(p,give,get);}catch(e){console.error(e);}
  finally{S.busy=false;}
  if(S.over)return;
  PT[p.id]={give:give,get:get,results:results};
  render();
  deliverTradeResult(p,results);
}
function ptradeExec(p,qid){
  var pt=PT[p.id];
  if(!pt||S.cur!==p.id||S.mode!=='actions'||S.busy||S.over)return;
  var r=pt.results.filter(function(x){return x.id===qid&&x.ok;})[0],q=S.players[qid];
  if(!r||!q)return;
  for(var i=0;i<5;i++){if(p.res[i]<pt.give[i]||q.res[i]<pt.get[i]){toastTo(p,'قطعهٔ کافی نیست');return;}}
  for(var j=0;j<5;j++){p.res[j]+=pt.get[j]-pt.give[j];q.res[j]+=pt.give[j]-pt.get[j];}
  log(p.name+' با '+q.name+' معامله کرد: داد '+fmtRes(pt.give)+'، گرفت '+fmtRes(pt.get)+'.');
  PT[p.id]=null;render();
}
function runCmd(p,m){
  if(!p||p.ai||S.over||!m)return;
  var c=m.cmd;
  p.acted=true;
  if(c==='roll'){if(S.cur===p.id&&S.mode==='needRoll'&&!S.busy&&S.waitRoll){var f=S.waitRoll;S.waitRoll=null;f();}return;}
  if(c==='end'){if(S.cur===p.id&&S.mode==='actions'&&!S.busy&&S.waitEnd){var g=S.waitEnd;S.waitEnd=null;g();}return;}
  if(c==='build'){if(['fil','star','gal','buy'].indexOf(m.kind)<0)return;actFor(p,function(){return hBuild(p,m.kind);});return;}
  if(c==='bank'){if(S.cur===p.id&&S.mode==='actions'&&!S.busy)doBank(p,m.give,m.get);return;}
  if(c==='play'){if(!CARD[m.type]||!playable(p,m.type))return;var st=S;actFor(p,function(){return playCard(p,m.type,st);},true);return;}
  if(c==='ptrade'){ptradePropose(p,m.give,m.get);return;}
  if(c==='ptradeWith'){ptradeExec(p,+m.id);return;}
}
function dispatchCmd(m){
  if(ROLE==='client'){if(NET.hostLink){var o={t:'cmd'};for(var k in m)o[k]=m[k];NET.hostLink.send(o);}}
  else runCmd(me(),m);
}
function openTrade(){
  var p=me(),give=-1,get=-1;
  var sh=openSheet('');
  function draw(){
    if(give>=0&&p.res[give]<ratio(p,give))give=-1;
    sh.innerHTML='<h3>برون‌سپاری</h3><p class="sub">نرخ پایه ۴ به ۱ است. درایو یا تابلو فرمان کنار بندر برون‌سپاری نرخ بهتر می‌دهد (۳ به ۱ یا ۲ به ۱).</p>'+
      '<div class="sub">می‌دهی (موجودی تو زیر هر قطعه)</div><div class="grid5">'+RS.map(function(n,i){var r=ratio(p,i);return '<button class="cb '+(give===i?'on':'')+'" data-g="'+i+'" '+(p.res[i]>=r?'':'disabled')+'>'+ico(i,24)+'<span class="nn">'+n+'</span><span class="hv">داری <b>'+fa(p.res[i])+'</b></span><small>'+fa(r)+':'+fa(1)+'</small></button>';}).join('')+'</div>'+
      '<div class="sub">می‌گیری</div><div class="grid5">'+RS.map(function(n,i){return '<button class="cb '+(get===i?'on':'')+'" data-t="'+i+'">'+ico(i,24)+'<span class="nn">'+n+'</span><span class="hv">داری <b>'+fa(p.res[i])+'</b></span></button>';}).join('')+'</div>'+
      '<button class="btn primary wide" data-do '+((give>=0&&get>=0&&give!==get)?'':'disabled')+'>برون‌سپاری</button><button class="btn wide" data-close>بستن</button>';
  }
  sh.addEventListener('click',function(e){
    var g=e.target.closest('[data-g]'),t=e.target.closest('[data-t]');
    if(g&&!g.disabled){give=+g.dataset.g;draw();return;}
    if(t){get=+t.dataset.t;draw();return;}
    if(e.target.closest('[data-do]')&&give>=0&&get>=0&&give!==get){dispatchCmd({cmd:'bank',give:give,get:get});return;}
    if(e.target.closest('[data-close]'))closeSheet();
  });
  curDraw=draw;
  draw();
}
function fmtRes(a){return a.map(function(n,i){return n?fa(n)+' '+RS[i]:'';}).filter(Boolean).join('، ');}
function openPlayerTrade(){
  var p=me(),give=[0,0,0,0,0],get=[0,0,0,0,0],results=null,waiting=false;
  var sh=openSheet('');
  function grid(kind,arr){
    return '<div class="grid5">'+RS.map(function(n,i){
      var other=kind==='give'?get:give;
      var plusOff=(kind==='give'?arr[i]>=p.res[i]:arr[i]>=4)||other[i]>0;
      return '<div class="tc">'+ico(i,22)+'<span class="nn">'+n+'</span><em class="hv">داری '+fa(p.res[i])+'</em><b>'+fa(arr[i])+'</b><div class="pm"><button data-s="'+kind+'" data-i="'+i+'" data-d="-1" '+(arr[i]<=0?'disabled':'')+'>−</button><button data-s="'+kind+'" data-i="'+i+'" data-d="1" '+(plusOff?'disabled':'')+'>+</button></div></div>';
    }).join('')+'</div>';
  }
  function draw(){
    if(waiting){sh.innerHTML='<h3>معامله با بازیکن‌ها</h3><p class="sub">منتظر پاسخ بازیکن‌ها…</p><button class="btn wide" data-close>بستن</button>';return;}
    if(!results){
      for(var i=0;i<5;i++)if(give[i]>p.res[i])give[i]=p.res[i];
      var ok=sum(give)>0&&sum(get)>0;
      sh.innerHTML='<h3>معامله با بازیکن‌ها</h3><p class="sub">بگو چه قطعاتی می‌دهی و چه قطعاتی می‌خواهی. بازیکن‌ها جواب می‌دهند.</p><div class="sub">می‌دهی (عدد درشت = مقدار پیشنهادی)</div>'+grid('give',give)+'<div class="sub">می‌خواهی</div>'+grid('get',get)+
        '<button class="btn primary wide" data-submit '+(ok?'':'disabled')+'>پیشنهاد به بقیه</button><button class="btn wide" data-close>بستن</button>';
    }else{
      var yes=results.filter(function(r){return r.ok;});
      sh.innerHTML='<h3>پاسخ بازیکن‌ها</h3><p class="sub">تو می‌دهی: '+fmtRes(give)+' · تو می‌گیری: '+fmtRes(get)+'</p><div class="score">'+
        results.map(function(r){return '<div><i class="dot" style="--pc:'+PH[r.id]+'"></i><span>'+S.players[r.id].name+'</span><b style="font-size:15px;font-family:var(--font-body)">'+(r.ok?'می‌پذیرد':'نمی‌پذیرد')+'</b></div>';}).join('')+'</div>'+
        yes.map(function(r){return '<button class="btn primary wide" data-with="'+r.id+'">معامله با '+S.players[r.id].name+'</button>';}).join('')+
        (yes.length?'':'<p class="sub">هیچ‌کس قبول نکرد. پیشنهاد را عوض کن یا چیزی بیشتر بده.</p>')+
        '<button class="btn wide" data-back>تغییر پیشنهاد</button><button class="btn wide" data-close>بستن</button>';
    }
  }
  sh.addEventListener('click',function(e){
    var b=e.target.closest('[data-s]');
    if(b&&!b.disabled){var arr=b.dataset.s==='give'?give:get;arr[+b.dataset.i]+=+b.dataset.d;draw();return;}
    var sub=e.target.closest('[data-submit]');

    var w=e.target.closest('[data-with]');
    if(w){dispatchCmd({cmd:'ptradeWith',id:+w.dataset.with});closeSheet();return;}
    if(e.target.closest('[data-back]')){results=null;draw();return;}
    if(e.target.closest('[data-close]'))closeSheet();
  });
  NET.onTradeResult=function(r){results=r;waiting=false;draw();};
  curDraw=draw;
  draw();
}

$('#dock').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');

  CANON.RN.forEach(function(x,i){add(x,TH.RN[i]);});

var TXS=new WeakMap();

  var tg=p.nodeName;if(tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA'||tg==='TITLE')return;
  var rec=TXS.get(n),v=n.nodeValue,orig=(rec&&v===rec.out)?rec.orig:v;
  var out=TX?TX(orig):orig;

}

  while((n=w.nextNode()))list.push(n);

var ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
function wrapConn(conn){
  var buf=[],om=null;
  var link={onclose:null,send:function(m){try{conn.send(m);}catch(e){}},close:function(){try{conn.close();}catch(e){}}};
  Object.defineProperty(link,'onmessage',{get:function(){return om;},set:function(f){om=f;if(om){while(buf.length)om(buf.shift());}}});
  conn.on('data',function(d){if(om)om(d);else buf.push(d);});
  conn.on('close',function(){if(link.onclose)link.onclose();});
  return link;
}
var PeerTransport={
  host:function(code,onLink,onReady,onError){
    var peer=new window.Peer('datis-'+code,{debug:1,config:ICE});
    peer.on('open',function(){onReady();});
    peer.on('error',function(e){onError(e);});
    peer.on('connection',function(conn){var link=wrapConn(conn);conn.on('open',function(){onLink(link);});});
    return {close:function(){try{peer.destroy();}catch(e){}}};
  },
  join:function(code,onLink,onError){
    var peer=new window.Peer({debug:1,config:ICE});
    peer.on('error',function(e){onError(e);});
    peer.on('open',function(){
      var conn=peer.connect('datis-'+code,{reliable:true,serialization:'json'});
      var link=wrapConn(conn);
      conn.on('open',function(){onLink(link);});
      conn.on('error',function(e){onError(e);});
      conn.on('close',function(){if(!link.opened)onError({type:'closed'});});
      conn.on('open',function(){link.opened=true;});
    });
    return {close:function(){try{peer.destroy();}catch(e){}}};
  }
};

function defaultAnswer(kind,pl){

    while(g++<300&&sum(sel)<pl.n){var i=rint(5);if(!pl.limit||sel[i]<pl.limit[i])sel[i]++;}

function validAnswer(kind,pl,v){
  if(kind==='target'){if(v===null)return !!pl.cancel;return pl.keys.indexOf(v)>=0;}
  if(kind==='pick'){
    if(!Array.isArray(v)||v.length!==5)return false;
    var t=0;
    for(var i=0;i<5;i++){var x=v[i];if(typeof x!=='number'||x<0||x%1!==0)return false;if(pl.limit&&x>pl.limit[i])return false;t+=x;}

function askSeat(p,kind,payload,ms){
  if(S&&S.tmo&&S.cur===p.id&&kind!=='offer'&&kind!=='tradeOffer')return Promise.resolve(defaultAnswer(kind,payload));
  var lim=ms?(window.__FAST?Math.min(ms,4000):ms):0;
  if(!p.remote){
    if(!lim){
      return new Promise(function(res){
        NET.localPend={kind:kind,payload:payload,res:res};
        localAsk(kind,payload).then(function(v){if(NET.localPend&&NET.localPend.res===res)NET.localPend=null;res(v);});
      });
    }
    return new Promise(function(res){
      var done=false,t=setTimeout(function(){if(done)return;done=true;p.timedOut=true;cancelLocal();res(defaultAnswer(kind,payload));},lim);
      localAsk(kind,payload).then(function(v){if(done)return;done=true;clearTimeout(t);res(v);});
    });

    var id=++NET.askId,done=false,t=null;

  },function(err){if(!linked){clearTimeout(tm);var t=err&&err.type;lobbyError(t==='peer-unavailable'?'اتاقی با این کد پیدا نشد. کد را بررسی کن و مطمئن شو میزبان صفحه را باز نگه داشته.':'اتصال برقرار نشد ('+(t||'خطا')+'). اینترنت را عوض کن (وای‌فای/موبایل) و دوباره تلاش کن.');}});
}
function saveName(n){try{localStorage.setItem('datis_name',n);}catch(e){}}
function loadName(){try{return localStorage.getItem('datis_name')||'';}catch(e){return '';}}
if(!onlineAvailable()){$('#onlineBox').innerHTML='<div class="sub">بازی آنلاین به اتصال اینترنت و بارگذاری کتابخانهٔ اتصال نیاز دارد.</div>';}
else{
  $('#mkRoom').addEventListener('click',function(){hostLobby(cleanName(loadName())||'میزبان');});
  $('#joinRoom').addEventListener('click',function(){joinRoom($('#joinCode').value,cleanName(loadName())||'مهمان');});
}
$('#lobby').addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('[data-copy]')){
    var c=NET.lv&&NET.lv.code;
    try{navigator.clipboard.writeText(c).then(function(){toast('کد کپی شد');},function(){toast('کد: '+c);});}catch(x){toast('کد: '+c);}
    return;
  }
  var sn=t.closest('[data-sn]');
  if(sn&&NET.lobby&&!sn.disabled){NET.lobby.n=+sn.dataset.sn;chosenN=NET.lobby.n;lobbyBroadcast();return;}
  if(t.closest('[data-start]')){startOnline();return;}
  if(t.closest('[data-leave]')){leaveOnline();S=null;showIntro();}
});
DIFF=loadDiff();paintDiff();
applyTheme(loadTheme(),true);
fitAll();
window.__cosmic={state:function(){if(S)S.me=MY;return S;},fx:function(k,t){if(t)applyTheme(t,true);playFx(k);},theme:function(t){applyTheme(t,true);}};
})();
