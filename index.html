async function entropyStep(p,st){
  if(S.era<2)return;
  var tot=sum(p.res);
  if(!tot){log('آشفتگی: '+p.name+' چیزی برای از دست دادن ندارد.');return;}
  if(p.ai){var i=argmax(p.res);p.res[i]--;log('آشفتگی از '+p.name+' یک '+RS[i]+' گرفت.');}
  else{
    var d=await pickResources({title:'آشفتگی: یک منبع را رها کن',n:1,limit:p.res});
    d.forEach(function(c,j){p.res[j]-=c;});
    log('آشفتگی از تو یک منبع گرفت.');
  }
  S.entropy++;p.stats.disc++;render();
}
var TMR=null;
function timerOn(){
  if(!S)return false;
  if(ROLE==='host')return S.players.some(function(q){return q.remote;});
  return ROLE==='solo'&&S.players.some(function(q){return !q.ai&&!q.remote;});
}
function limitFor(p){return p.idle>=1?30:60;}
function tScale(){return window.__TSCALE||1;}
function armTimer(p,st,sec){
  clearTimeout(TMR);
  var ms=(sec||limitFor(p))*1000*tScale();
  S.tEnd=Date.now()+ms;
  TMR=setTimeout(function(){onTimeout(p,st);},ms);
  scheduleSync();
}
function disarmTimer(){clearTimeout(TMR);TMR=null;if(S){S.tEnd=0;S.tmo=false;}}
function onTimeout(p,st){
  if(stale(st)||S.cur!==p.id)return;
  S.tmo=true;
  log(p.name+': وقتش تمام شد.');
  NET.pending.forEach(function(pd){if(pd.seat===p.id){toSeat(p.id,{t:'closeAsk',id:pd.id});pd.fin(defaultAnswer(pd.kind,pd.payload));}});
  var lp=NET.localPend;
  if(lp&&!p.remote){NET.localPend=null;cancelLocal();lp.res(defaultAnswer(lp.kind,lp.payload));}
  else if(!p.remote&&(S.sel||curSheet)){cancelLocal();}
  if(S.waitRoll){var f=S.waitRoll;S.waitRoll=null;f();}
  if(S.waitEnd){var g=S.waitEnd;S.waitEnd=null;g();}
}
function cancelLocal(){if(S&&S.sel)S.sel=null;closeSheet();render();}
function strikeCheck(p){
  if(p.acted){p.idle=0;return;}
  p.idle++;
  if(p.idle>=2&&p.remote){kickPlayer(p);return;}
  log(p.name+' در این نوبت هیچ کاری نکرد.');
  toastTo(p,p.remote?'اخطار! نوبت بعدی فقط ۳۰ ثانیه وقت داری. اگر دوباره کاری نکنی از بازی حذف می‌شوی.':'نوبت بعدی فقط ۳۰ ثانیه وقت داری.');
}
function kickPlayer(p){
  var seat=p.id,l=NET.links[seat];
  log(p.name+' به‌خاطر بی‌تحرکی از بازی حذف شد و هوش مصنوعی جایش را گرفت.');
  toSeat(seat,{t:'kicked'});
  p.ai=true;p.remote=false;p.kicked=true;NET.links[seat]=null;
  if(l){l.onclose=null;setTimeout(function(){l.close();},400);}
  NET.pending.forEach(function(pd){if(pd.seat===seat)pd.fin(defaultAnswer(pd.kind,pd.payload));});
}
async function turn(p,st,rmode){
  S.cur=p.id;
  if(rmode!=='actions'){p.fresh={};p.playedCard=false;p.novaUsed=false;S.hotNum=null;p.stats.turns++;}
  S.mode='idle';S.busy=false;
  render();
  await sleep(300);
  if(stale(st))return;
  await entropyStep(p,st);
  if(stale(st))return;
  if(p.ai){scheduleSave(true);await aiTurn(p,st,rmode==='actions');}
  else{
    var tOn=timerOn();
    p.acted=(rmode==='actions');S.tmo=false;
    if(tOn)armTimer(p,st);
    if(rmode!=='actions'){
      S.mode='needRoll';render();
      await new Promise(function(r){S.waitRoll=r;});
      if(stale(st)){disarmTimer();return;}
      if(p.ai){disarmTimer();await aiTurn(p,st);S.mode='idle';return;}
      S.mode='idle';S.busy=true;render();
      await rollAndResolve(p,st);
      S.busy=false;
      if(stale(st)){disarmTimer();return;}
    }
    if(!S.tmo&&!p.ai){S.mode='actions';render();await new Promise(function(r){S.waitEnd=r;});}
    if(tOn&&!stale(st))strikeCheck(p);
    disarmTimer();
  }
  S.mode='idle';
}
async function endRound(st){
  S.round++;
  if(S.round>60){
    var best=S.players.slice().sort(function(a,b){return totalPoints(b)-totalPoints(a);})[0];
    S.over=true;S.winner=best.id;render();showEnd();return;
  }
  render();
  await sleep(300);
}
async function orderPhase(st){
  /* everyone rolls two dice; ties re-roll among themselves until the order is fully decided */
  var N=S.players.length,ids=[],i;
  for(i=0;i<N;i++)ids.push(i);
  S.phase='order';S.mode='idle';
  async function rank(group,depth){
    var res=[];
    for(var k=0;k<group.length;k++){
      if(stale(st))return null;
      var p=S.players[group[k]],a=1+rint(6),b=1+rint(6);
      S.cur=p.id;
      for(var f=0;f<4;f++){S.dice=[1+rint(6),1+rint(6)];S.rolling=true;render();await sleep(70);}
      S.dice=[a,b];S.rolling=false;render();
      log(p.name+' تاس ریخت: '+fa(a)+' + '+fa(b)+' = '+fa(a+b)+(depth?' (دوباره)':''));
      await sleep(560);
      res.push({id:p.id,v:a+b});
    }
    var by={};res.forEach(function(r){(by[r.v]=by[r.v]||[]).push(r.id);});
    var vs=Object.keys(by).map(Number).sort(function(x,y){return y-x;}),out=[];
    for(var j=0;j<vs.length;j++){
      var g=by[vs[j]];
      if(g.length===1)out.push(g[0]);
      else{
        if(stale(st))return null;
        log('مساوی شد؛ '+g.map(function(id){return S.players[id].name;}).join('، ')+' دوباره تاس می‌ریزند.');
        var sub=await rank(g,depth+1);if(!sub)return null;
        out=out.concat(sub);
      }
    }
    return out;
  }
  var o=await rank(ids,0);
  if(!o||stale(st))return false;
  S.order=o;S.cur=o[0];S.dice=null;
  log('ترتیب بازی: '+o.map(function(id){return S.players[id].name;}).join(' ← '));
  render();await sleep(900);
  return true;
}
async function setupPhase(st,from){
  var N=S.players.length,ord=(S.order||[]).slice();
  if(ord.length!==N){ord=[];for(var i=0;i<N;i++)ord.push(i);}
  var seq=ord.concat(ord.slice().reverse());
  S.phase='setup';
  for(var s=from||0;s<seq.length;s++){
    if(stale(st))return;
    S.setupS=s;scheduleSave(true);
    var p=S.players[seq[s]],second=s>=N;
    S.cur=p.id;S.mode='idle';render();
    var vk,ek,sTmr=timerOn()&&!p.ai,sMs=sTmr?limitFor(p)*1000*tScale():0;
    if(sTmr){p.timedOut=false;S.tEnd=Date.now()+sMs;scheduleSync();}
    if(p.ai){await sleep(380);vk=aiSetupStar(p);}
    else vk=await askSeat(p,'target',{kind:'vertex',keys:starSpots(p,true),cancel:false,hint:(second?'درایو دوم':'درایو نخست')+' را روی یکی از نقطه‌های روشن نصب کن'},sMs);
    if(stale(st))return;
    S.bld.set(vk,{o:p.id,t:'star',planet:false});
    if(second)S.verts.get(vk).tiles.forEach(function(tk){var t=S.tiles.get(tk),r=tileRes(t);if(r>=0)p.res[r]++;});
    render();
    if(sTmr){S.tEnd=Date.now()+sMs;scheduleSync();}
    if(p.ai){await sleep(280);ek=aiSetupFil(p,vk);}
    else ek=await askSeat(p,'target',{kind:'edge',keys:filSpots(p,vk),cancel:false,hint:'یک کابل شبکه کنار درایو بکش'},sMs);
    if(stale(st))return;
    if(sTmr){S.tEnd=0;p.acted=!p.timedOut;strikeCheck(p);}
    S.fil.set(ek,p.id);
    updateAwards();render();
    log(p.name+' '+(second?'درایو دوم':'درایو نخست')+' و یک کابل شبکه را گذاشت.');
    await sleep(200);
  }
  S.phase='play';
}
async function mainLoop(st,rs){
  if(!rs&&!S.order){if(!(await orderPhase(st)))return;}
  if(!S.order||S.order.length!==S.players.length){S.order=S.players.map(function(p){return p.id;});}
  if(!rs||rs.phase==='setup'){await setupPhase(st,rs?rs.setupS:0);}
  else S.phase='play';
  if(stale(st))return;
  if(!rs)log('بازی شروع شد. موفق باشی!');
  var startI=(rs&&rs.phase==='play')?Math.max(0,S.order.indexOf(rs.cur)):0,rmode=(rs&&rs.phase==='play')?rs.mode:null;
  while(!stale(st)){
    for(var i=startI;i<S.players.length;i++){
      if(stale(st))return;
      await turn(S.players[S.order[i]],st,i===startI?rmode:null);
    }
    startI=0;rmode=null;
    if(stale(st))return;
    await endRound(st);
  }
}
function checkWin(){
  if(S.over)return true;
  var p=S.players[S.cur];
  if(p&&S.phase==='play'&&totalPoints(p)>=WIN){
    S.over=true;S.winner=p.id;S.sel=null;
    var a=S.waitEnd,b=S.waitRoll;S.waitEnd=null;S.waitRoll=null;
    render();
    if(a)a();if(b)b();
    setTimeout(showEnd,window.__FAST?0:700);
    return true;
  }
  return false;
}

/* ---------- human actions ---------- */
async function actFor(p,fn,pre){
  if(!p||S.cur!==p.id||S.busy||S.over||!(S.mode==='actions'||(pre&&S.mode==='needRoll')))return;
  S.busy=true;render();
  try{await fn();}catch(e){console.error(e);}
  finally{S.busy=false;if(!S.over)render();}
}
function canDo(p,kind){
  if(kind==='fil')return canPay(p,COST.fil)&&count(p,'fil')<LIM.fil&&filSpots(p).length>0;
  if(kind==='star')return canPay(p,COST.star)&&count(p,'star')<LIM.star&&starSpots(p,false).length>0;
  if(kind==='gal')return canPay(p,COST.gal)&&count(p,'gal')<LIM.gal&&count(p,'star')>0;
  if(kind==='buy')return canPay(p,COST.buy)&&S.deck.length>0;
  return false;
}
async function hBuild(p,kind){
  if(!canDo(p,kind))return;
  if(kind==='buy'){buyCard(p);return;}
  var keys=[],hint='',kk='vertex';
  if(kind==='fil'){keys=filSpots(p);hint='مسیر کابل شبکه را انتخاب کن';kk='edge';}
  else if(kind==='star'){keys=starSpots(p,false);hint='جای درایو را انتخاب کن';}
  else if(kind==='gal'){S.bld.forEach(function(b,vk){if(b.o===p.id&&b.t==='star')keys.push(vk);});hint='کدام درایو به تابلو فرمان ارتقا یابد؟';}
  else return;
  var k=await askSeat(p,'target',{kind:kk,keys:keys,cancel:true,hint:hint});
  if(k&&canDo(p,kind))doBuild(p,kind,k,false);
}
function doBank(p,give,get){
  give=+give;get=+get;
  if(!(give>=0&&give<5&&get>=0&&get<5&&give!==get&&give%1===0&&get%1===0))return;
  var r=ratio(p,give);
  if(p.res[give]<r)return;
  p.res[give]-=r;p.res[get]++;p.stats.bank++;
  log(p.name+' '+fa(r)+' '+RS[give]+' را برون‌سپاری کرد و یک '+RS[get]+' گرفت.');
  render();
}
function cleanArr(a){
  if(!Array.isArray(a)||a.length!==5)return null;
  return a.map(function(x){x=Math.floor(+x);return (x>0&&x<10)?x:0;});
}
function collectTradeResponses(p,give,get){
  return Promise.all(S.players.filter(function(q){return q.id!==p.id;}).map(function(q){
    if(q.ai)return Promise.resolve({id:q.id,ok:aiAccepts(q,give,get,p)});
    for(var i=0;i<5;i++)if(q.res[i]<get[i])return Promise.resolve({id:q.id,ok:false});
    return askSeat(q,'tradeOffer',{from:p.name,give:give,get:get},25000).then(function(v){return {id:q.id,ok:!!v};});
  }));
}
function deliverTradeResult(p,results){
  if(p.remote)toSeat(p.id,{t:'ptradeResult',results:results});
  else if(NET.onTradeResult)NET.onTradeResult(results);
}
async function ptradePropose(p,give,get){
  if(S.cur!==p.id||S.mode!=='actions'||S.busy||S.over)return;
  give=cleanArr(give);get=cleanArr(get);
  if(!give||!get||sum(give)<1||sum(get)<1)return;
  for(var i=0;i<5;i++){if(give[i]>p.res[i]||(give[i]>0&&get[i]>0))return;}
  S.busy=true;render();
  var results=[];
  try{results=await collectTradeResponses(p,give,get);}catch(e){console.error(e);}
  finally{S.busy=false;}
  if(S.over)return;
  PT[p.id]={give:give,get:get,results:results};
  render();
  deliverTradeResult(p,results);
}
function ptradeExec(p,qid){
  var pt=PT[p.id];
  if(!pt||S.cur!==p.id||S.mode!=='actions'||S.busy||S.over)return;
  var r=pt.results.filter(function(x){return x.id===qid&&x.ok;})[0],q=S.players[qid];
  if(!r||!q)return;
  for(var i=0;i<5;i++){if(p.res[i]<pt.give[i]||q.res[i]<pt.get[i]){toastTo(p,'قطعهٔ کافی نیست');return;}}
  for(var j=0;j<5;j++){p.res[j]+=pt.get[j]-pt.give[j];q.res[j]+=pt.give[j]-pt.get[j];}
  p.stats.ptr++;q.stats.ptr++;
  log(p.name+' با '+q.name+' معامله کرد: داد '+fmtRes(pt.give)+'، گرفت '+fmtRes(pt.get)+'.');
  PT[p.id]=null;render();
}
function runCmd(p,m){
  if(!p||p.ai||S.over||!m)return;
  var c=m.cmd;
  p.acted=true;
  if(c==='roll'){if(S.cur===p.id&&S.mode==='needRoll'&&!S.busy&&S.waitRoll){var f=S.waitRoll;S.waitRoll=null;f();}return;}
  if(c==='end'){if(S.cur===p.id&&S.mode==='actions'&&!S.busy&&S.waitEnd){var g=S.waitEnd;S.waitEnd=null;g();}return;}
  if(c==='build'){if(['fil','star','gal','buy'].indexOf(m.kind)<0)return;actFor(p,function(){return hBuild(p,m.kind);});return;}
  if(c==='bank'){if(S.cur===p.id&&S.mode==='actions'&&!S.busy)doBank(p,m.give,m.get);return;}
  if(c==='play'){if(!CARD[m.type]||!playable(p,m.type))return;var st=S;actFor(p,function(){return playCard(p,m.type,st);},true);return;}
  if(c==='ptrade'){ptradePropose(p,m.give,m.get);return;}
  if(c==='ptradeWith'){ptradeExec(p,+m.id);return;}
}

      sh.innerHTML='<h3>پاسخ بازیکن‌ها</h3><p class="sub">تو می‌دهی: '+fmtRes(give)+' · تو می‌گیری: '+fmtRes(get)+'</p><div class="score">'+
        results.map(function(r){return '<div><i class="dot" style="--pc:'+PH[r.id]+'"></i><span>'+S.players[r.id].name+'</span><b style="font-size:15px;font-family:var(--font-body)">'+(r.ok?'می‌پذیرد':'نمی‌پذیرد')+'</b></div>';}).join('')+'</div>'+
        yes.map(function(r){return '<button class="btn primary wide" data-with="'+r.id+'">معامله با '+S.players[r.id].name+'</button>';}).join('')+
        (yes.length?'':'<p class="sub">هیچ‌کس قبول نکرد. پیشنهاد را عوض کن یا چیزی بیشتر بده.</p>')+
        '<button class="btn wide" data-back>تغییر پیشنهاد</button><button class="btn wide" data-close>بستن</button>';
    }
  }
  sh.addEventListener('click',function(e){
    var b=e.target.closest('[data-s]');
    if(b&&!b.disabled){var arr=b.dataset.s==='give'?give:get;arr[+b.dataset.i]+=+b.dataset.d;draw();return;}
    var sub=e.target.closest('[data-submit]');
    if(sub&&!sub.disabled){waiting=true;draw();dispatchCmd({cmd:'ptrade',give:give.slice(),get:get.slice()});return;}
    var w=e.target.closest('[data-with]');
    if(w){dispatchCmd({cmd:'ptradeWith',id:+w.dataset.with});closeSheet();return;}
    if(e.target.closest('[data-back]')){results=null;draw();return;}
    if(e.target.closest('[data-close]'))closeSheet();

  draw();

function openCards(){
  var p=me();
  var sh=openSheet('');
  function draw(){
    var rows=Object.keys(CARD).filter(function(k){return p.cards[k]>0;}).map(function(k){
      var can=playable(p,k)&&S.cur===p.id&&(S.mode==='actions'||S.mode==='needRoll')&&!S.busy;
      return '<div class="crow"><div><b>'+CARD[k].n+'</b> <span class="cnt">×'+fa(p.cards[k])+'</span><p>'+CARD[k].d+'</p>'+
        ((p.fresh[k]&&k!=='fine')?'<small>تازه گرفته‌ای. نوبت بعد قابل بازی است.</small>':'')+'</div>'+

    }).join('');

      '<p class="sub">سرباز بازی‌شده: '+fa(p.played)+'. بزرگ‌ترین ارتش (دست‌کم ۳ سرباز) ۲ امتیاز دارد. هر نوبت فقط یک کارت بازی می‌شود. در دسته '+fa(S.deck.length)+' کارت مانده.</p><button class="btn wide" data-close>بستن</button>';
  }
  sh.addEventListener('click',function(e){
    var pb=e.target.closest('[data-play]');

    if(e.target.closest('[data-close]'))closeSheet();

}

var CHAT_T=['معامله می‌کنیم؟','یک به یک قبول؟','نه، پیشنهادت کمه','قبول! بده بیاد','یه کم صبر کن فکر کنم','دو به یک حساب کنیم؟','فعلاً چیزی ندارم','این آخرین پیشنهادمه!'];
var CHAT_O=['خرابی را یک جای دیگر ببر!','مواظب امتیازت باش 😏','شانس آوردی!','این دور مال منه 😎','بازی تازه شروع شده!','به‌به، چه کابل شبکه‌ای! 👏','زود باش، نوبتت را بازی کن ⏳','با تو که حال نمی‌ده 😂','آفرین، بازی قشنگی بود','قبل از اینکه ببری، من می‌برم!','ای بابا، باز خرابی آمد سراغم 😭','دمت گرم، حریف خوبی هستی','جمعش کن بابا','معاملات مشکوک','دهنت سرویسه','چی شد؟؟؟','حالتو می‌گیرم','بذار منبع گیرم بیاد نشونت می‌دم','راهشو ببند','از سر راهم برو کنار','مسجد جا این کارا نیست!'];
function chatText(k,i,r){
  if(k==='m')return CHAT_T[i];
  if(k==='o')return CHAT_O[i];
  if(k==='w')return 'کسی '+RS[r]+' دارد؟ من می‌خواهمش!';
  if(k==='h')return RS[r]+' اضافه دارم، کسی می‌خواهد؟';
  return '';
}
function chatValid(m){
  if(!m)return false;
  var i=m.i|0,r=m.r|0;
  if(m.k==='m')return i>=0&&i<CHAT_T.length;
  if(m.k==='o')return i>=0&&i<CHAT_O.length;
  if(m.k==='w'||m.k==='h')return r>=0&&r<5;
  return false;
}
function showSay(from,k,i,r){
  if(!S||!S.players[from])return;
  var p=S.players[from],text=chatText(k,i,r);if(!text)return;
  NET.chatLog=(NET.chatLog||[]).concat([{from:from,text:text}]).slice(-30);
  var old=document.getElementById('say'+from);if(old)old.remove();
  var card=document.querySelectorAll('#players .pl')[from];
  var d=document.createElement('div');d.className='say';d.id='say'+from;d.style.setProperty('--pc',PH[from]);d.textContent=text;
  document.body.appendChild(d);
  var rc=card?card.getBoundingClientRect():{left:8,bottom:60,width:100},w=d.offsetWidth;
  d.style.left=Math.min(Math.max(8,rc.left+rc.width/2-w/2),window.innerWidth-w-8)+'px';
  d.style.top=(rc.bottom+4)+'px';
  setTimeout(function(){if(d.parentNode)d.remove();},4800);
  var lg=document.getElementById('chatLog');if(lg)drawChatLog(lg);
  buzz([30]);
}
function drawChatLog(el){
  var L=(NET.chatLog||[]).slice(-4);
  el.innerHTML=L.length?L.map(function(c){var q=S.players[c.from];return '<div><i class="dot" style="--pc:'+PH[c.from]+'"></i><b>'+q.name+':</b> '+c.text+'</div>';}).join(''):'<div class="sub">هنوز پیامی نیست.</div>';
}
function emitChat(from,k,i,r){
  if(!S||!S.players[from])return;
  showSay(from,k,i,r);
  Object.keys(NET.links).forEach(function(seat){var l=NET.links[seat];if(l)l.send({t:'chat',from:from,k:k,i:i,r:r});});
  var sp=S.players[from];
  if(sp.ai)return;
  var ais=S.players.filter(function(q){return q.ai&&q.id!==from;});
  if(!ais.length||Math.random()>0.75)return;
  var q=pick(ais),kk='m',ii=0,rr=0;
  if(k==='m'){kk='m';ii=pick(i===2?[5,7]:(i===0?[1,3]:[3,2,4]));}
  else if(k==='w'){kk='m';ii=q.res[r]>=2?1:6;}
  else if(k==='h'){kk='m';ii=q.res[r]===0?0:4;}
  else{kk='o';ii=pick([0,1,2,3,4,5,7,8,9,11]);}
  setTimeout(function(){if(S&&!S.over&&q.ai)emitChat(q.id,kk,ii,rr);},1200+rint(1800));
}
function aiReact(victim,thief){
  if(!S||S.over)return;
  if(victim.ai&&Math.random()<0.5)setTimeout(function(){if(S&&!S.over)emitChat(victim.id,'o',pick([10,0,7]),0);},1500+rint(1200));
  else if(thief.ai&&Math.random()<0.3)setTimeout(function(){if(S&&!S.over)emitChat(thief.id,'o',pick([1,3,4]),0);},1500+rint(1200));
}
function sendChat(k,i,r){
  if(!S||MY==null)return;
  var now=Date.now();if(NET.chatAt&&now-NET.chatAt<900)return;NET.chatAt=now;
  var m={k:k,i:i|0,r:r|0};if(!chatValid(m))return;
  if(ROLE==='client'){if(NET.hostLink)NET.hostLink.send({t:'chat',k:m.k,i:m.i,r:m.r});}
  else emitChat(MY,m.k,m.i,m.r);
}
function openChat(){
  var tab='t';
  var sh=openSheet('<h3>گفتگو</h3><div class="tabs"><button class="on" data-ct="t">معامله</button><button data-ct="o">کل‌کل</button></div><div id="chatBody"></div><div id="chatLog" class="chatlog"></div><button class="btn wide" data-close>بستن</button>');
  function icons(k){return '<div class="grid5">'+[0,1,2,3,4].map(function(i){return '<button class="cb" data-send="'+k+'" data-r="'+i+'">'+ico(i,22)+'<span>'+RS[i]+'</span></button>';}).join('')+'</div>';}
  function draw(){
    var h='';
    if(tab==='t')h+='<div class="sub">من می‌خواهم:</div>'+icons('w')+'<div class="sub">اضافه دارم:</div>'+icons('h')+'<div class="phr">'+CHAT_T.map(function(t,i){return '<button class="btn small" data-send="m" data-i="'+i+'">'+t+'</button>';}).join('')+'</div>';
    else h+='<div class="phr">'+CHAT_O.map(function(t,i){return '<button class="btn small" data-send="o" data-i="'+i+'">'+t+'</button>';}).join('')+'</div>';
    sh.querySelector('#chatBody').innerHTML=h;
    Array.prototype.forEach.call(sh.querySelectorAll('[data-ct]'),function(b){b.classList.toggle('on',b.dataset.ct===tab);});
    drawChatLog(sh.querySelector('#chatLog'));
  }
  draw();
  sh.addEventListener('click',function(e){
    var ct=e.target.closest('[data-ct]');if(ct){tab=ct.dataset.ct;draw();return;}
    var sd=e.target.closest('[data-send]');
    if(sd){sendChat(sd.dataset.send,+sd.dataset.i||0,+sd.dataset.r||0);closeSheet();return;}
    if(e.target.closest('[data-close]'))closeSheet();
  });
}

function mPlay(c,e,off){
  var t=e[0]+off;
  if(e[1]===0){
    var o=c.createOscillator(),g=c.createGain();
    o.type=e[2];o.frequency.setValueAtTime(e[3],t);
    var vol=e[5],atk=Math.min(e[6],e[4]*.8);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(0.0001,t+e[4]);
    if(e[7]){var fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=e[7];o.connect(fl);fl.connect(g);}else o.connect(g);
    g.connect(MUS.master);o.start(t);o.stop(t+e[4]+.05);
  }else{
    var n=Math.floor(c.sampleRate*e[2]),bf=c.createBuffer(1,n,c.sampleRate),d=bf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    var sr=c.createBufferSource();sr.buffer=bf;var f2=c.createBiquadFilter();f2.type=e[5];f2.frequency.value=e[4];
    var g2=c.createGain();g2.gain.setValueAtTime(e[3],t);g2.gain.exponentialRampToValueAtTime(0.0001,t+e[2]);
    sr.connect(f2);f2.connect(g2);g2.connect(MUS.master);sr.start(t);
  }
}

  MUS.theme=TH.key;MUS.loop=0;
  var cm=compose(key,0);MUS.ev=cm.ev;MUS.dur=cm.dur;MUS.idx=0;MUS.off=c.currentTime+.2;
  MUS.master=c.createGain();MUS.comp=c.createDynamicsCompressor();
  MUS.master.gain.setValueAtTime(0.0001,c.currentTime);MUS.master.gain.linearRampToValueAtTime(1,c.currentTime+2);
  MUS.master.connect(MUS.comp);MUS.comp.connect(c.destination);
  var mine=MUS.master;

    if(document.hidden){return;}
    var now=c.currentTime;

      if(MUS.idx>=MUS.ev.length){MUS.loop++;MUS.off+=MUS.dur;var nx=compose(key,MUS.loop);MUS.ev=nx.ev;MUS.dur=nx.dur;MUS.idx=0;}

function showRejoin(){
  var d=document.getElementById('rejoin');
  if(!d){d=document.createElement('div');d.id='rejoin';d.innerHTML='<span>ارتباط قطع شد. در حال اتصال دوباره…</span><button class="btn small" data-rj-exit>خروج</button>';document.body.appendChild(d);
    d.addEventListener('click',function(e){if(e.target.closest('[data-rj-exit]')){recClear();leaveOnline();S=null;hideRejoin();showIntro();}});}
  d.hidden=false;
}
function hideRejoin(){var d=document.getElementById('rejoin');if(d)d.hidden=true;}
function startRejoin(){
  if(NET.rejoinT||!NET.cli)return;
  showRejoin();
  var n=0;
  (function attempt(){
    if(NET.linkOk)return;
    if(++n>150){NET.rejoinT=null;hideRejoin();
      var sh=openSheet('<h3>اتصال دوباره ممکن نشد</h3><p class="sub">میزبان پیدا نشد. شاید صفحه‌اش بسته شده.</p><button class="btn primary wide" data-again>تلاش دوباره</button><button class="btn wide" data-home>صفحهٔ اصلی</button>',{dismiss:false});
      sh.addEventListener('click',function(e){if(e.target.closest('[data-again]')){closeSheet();startRejoin();}else if(e.target.closest('[data-home]')){closeSheet();recClear();leaveOnline();S=null;showIntro();}});
      return;}
    try{if(NET.peer)NET.peer.close();}catch(e){}
    connectClient(false);
    NET.rejoinT=setTimeout(attempt,3500);
  })();
}
function onHostLost(link){
  if(link!==NET.hostLink)return;
  NET.linkOk=false;
  if(S&&S.over||NET.kicked||NET.leaving)return;
  if(S&&NET.started)startRejoin();
  else if(NET.cli&&(NET.lobRetry=(NET.lobRetry||0)+1)<=8){lobbyError('اتصال قطع شد؛ دوباره وصل می‌شوم…');setTimeout(function(){if(NET.cli&&!NET.started&&!NET.linkOk&&!NET.leaving)connectClient(true);},2500);}
  else lobbyError('ارتباط با میزبان قطع شد.');
}
var hidAt=0;
function mgNudge(force){try{if(M&&M.mode==='guest'&&M.nudge)M.nudge(force);}catch(e){}}
function nudgeRejoin(force){
  try{
    if(!(ROLE==='client'&&NET.cli&&S&&NET.started&&!NET.kicked&&!S.over))return;
    if(NET.linkOk&&!force)return;
    if(force&&NET.hostLink){var hl=NET.hostLink;NET.hostLink=null;NET.linkOk=false;try{hl.onclose=null;hl.close();}catch(e){}}
    clearTimeout(NET.rejoinT);NET.rejoinT=null;startRejoin();
  }catch(e){}
}
window.addEventListener('online',function(){nudgeRejoin(true);mgNudge(true);});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hidAt=Date.now();return;}
  var gone=hidAt?Date.now()-hidAt:0;hidAt=0;
  setTimeout(function(){nudgeRejoin(gone>4000);mgNudge(gone>4000);},400);
});

var PK={prof:'datis_prof',fr:'datis_friends',rec:'datis_recent',g:'datis_games'};
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function dg(x){return String(x==null?'':x).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-1776);}).replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632);});}
function newUid(){var o='';for(var i=0;i<5;i++)o+=rint(10);return o;}
function cleanUid(x){x=dg(x).replace(/[^0-9]/g,'');return x.length===5?x:null;}
var PROF=(function(){var p=lsGet(PK.prof,null);if(!p||!cleanUid(p.id)){p={id:newUid()};lsSet(PK.prof,p);}return p;})();
var FR=lsGet(PK.fr,[]).filter(function(f){return f&&cleanUid(f.id);}),REC=lsGet(PK.rec,[]).filter(function(f){return f&&cleanUid(f.id);}),PM={};
function saveFR(){lsSet(PK.fr,FR);}
function frFind(id){for(var i=0;i<FR.length;i++)if(FR[i].id===id)return FR[i];return null;}
function myName(){return cleanName(loadName())||'بازیکن';}
function myAvP(){return typeof myAv==='function'?myAv():-1;}
function ni(x){x=Math.floor(+x);return (x>0&&x<1e6)?x:0;}
function cleanStats(s){
  var o={};['all','wk','mo'].forEach(function(k){var v=s&&s[k]||{};o[k]={g:ni(v.g),w:ni(v.w),p:ni(v.p)};});
  return o;
}
function myStats(onlineOnly){
  var g=lsGet(PK.g,[]).filter(function(x){return !onlineOnly||x.o;}),now=Date.now();
  function agg(f){var r={g:0,w:0,p:0};g.forEach(function(x){if(f(x)){r.g++;r.w+=x.w;r.p+=x.p;}});return r;}
  return {all:agg(function(){return true;}),wk:agg(function(x){return now-x.t<7*864e5;}),mo:agg(function(x){return now-x.t<30*864e5;})};
}

function stInit(){
  var z=function(){return [];};
  M.st={t0:Date.now(),mv:[],c:[],mp:0,mps:-1};
  for(var i=0;i<M.n;i++){M.st.mv.push(0);M.st.c.push({});}
}
function stAdd(seat,k,v){
  if(!M||!M.st||seat<0||!M.st.c[seat])return;
  var o=M.st.c[seat];o[k]=(o[k]||0)+(v===undefined?1:v);
}
function stMax(seat,k,v){
  if(!M||!M.st||seat<0||!M.st.c[seat])return;
  var o=M.st.c[seat];if(!(o[k]>=v))o[k]=v;
}
function stAct(seat,m,ok){
  if(!ok||!M||!M.st||!M.st.c[seat])return;
  M.st.mv[seat]++;
  var a=m&&typeof m==='object'?m.a:null;
  if(a)stAdd(seat,'a_'+a);
}

function addRecent(list){
  list.forEach(function(x){
    var id=cleanUid(x.uid||x.id);if(!id||id===PROF.id)return;
    var old=null;REC=REC.filter(function(r){if(r.id===id){old=r;return false;}return true;});
    REC.unshift({id:id,name:cleanName(x.name)||'بازیکن',t:Date.now(),stats:old&&old.stats,seen:old&&old.seen});
  });
  REC=REC.slice(0,30);lsSet(PK.rec,REC);
}
function relTo(id){var e=frFind(id);return !e?'none':(e.st==='fr'?'fr':(e.st==='in'?'in':'out'));}
function handleHi(id,m){
  PM[id]={on:true,t:Date.now()};
  var name=cleanName(m.name)||'بازیکن',e=frFind(id),rc=null,R=m.rel;
  REC.forEach(function(r){if(r.id===id)rc=r;});
  if(R==='out'){
    if(!e){e={id:id,name:name,st:'in'};FR.push(e);toast(name+' درخواست دوستی فرستاد');}
    else if(e.st==='out')e.st='fr';
  }else if(R==='fr'){
    if(e&&(e.st==='out'||e.st==='in'))e.st='fr';
  }else if(R==='none'){
    if(e&&e.st==='fr'){FR=FR.filter(function(x){return x!==e;});e=null;}
  }
  var st=m.stats?cleanStats(m.stats):null;
  var av=avI(m.av);
  if(e){e.name=name;e.av=av;if(st)e.stats=st;e.seen=Date.now();}
  if(rc){rc.name=name;rc.av=av;if(st)rc.stats=st;rc.seen=Date.now();lsSet(PK.rec,REC);}
  saveFR();peopleDraw();
}

function wrapConn(conn){
  var buf=[],om=null;
  var link={onclose:null,send:function(m){try{conn.send(m);}catch(e){}},close:function(){try{conn.close();}catch(e){}}};
  Object.defineProperty(link,'onmessage',{get:function(){return om;},set:function(f){om=f;if(om){while(buf.length)om(buf.shift());}}});

}
var PeerTransport={
  host:function(code,onLink,onReady,onError){
    var peer=new window.Peer('datis-'+code,{debug:1,config:ICE});
    peer.on('open',function(){onReady();});
    peer.on('error',function(e){onError(e);});
    peer.on('connection',function(conn){var link=wrapConn(conn);conn.on('open',function(){onLink(link);});});
    return {close:function(){try{peer.destroy();}catch(e){}}};
  },
  join:function(code,onLink,onError){
    var peer=new window.Peer({debug:1,config:ICE});
    peer.on('error',function(e){onError(e);});
    peer.on('open',function(){
      var conn=peer.connect('datis-'+code,{reliable:true,serialization:'json'});
      var link=wrapConn(conn);
      conn.on('open',function(){onLink(link);});
      conn.on('error',function(e){onError(e);});
      conn.on('close',function(){if(!link.opened)onError({type:'closed'});});
      conn.on('open',function(){link.opened=true;});

      var done=false,t=setTimeout(function(){if(done)return;done=true;p.timedOut=true;cancelLocal();res(defaultAnswer(kind,payload));},lim);

function jzEvOpts(seat,k){

function jzEvClean(){

    for(cc3=0;cc3<x.fu.length&&f3<0;cc3++)for(i=0;i<x.nf[seat];i++)if(!x.fl[seat][i]&&!x.sn[seat][i]){f3=i;ci3=cc3;break;}

/* ---- tavla (backgammon) ---- */
function tvSign(s){return s===0?1:-1;}
function tvStart(){
  var p=[],i;for(i=0;i<24;i++)p.push(0);
  p[23]=2;p[12]=5;p[7]=3;p[5]=5;
  p[0]=-2;p[11]=-5;p[16]=-3;p[18]=-5;
  return p;
}
function tvCopy(p){return {pts:p.pts.slice(),bar:p.bar.slice(),off:p.off.slice()};}
function tvAllHome(p,s){
  if(p.bar[s]>0)return false;
  var sg=tvSign(s);
  for(var i=0;i<24;i++)if(p.pts[i]*sg>0&&!(s===0?i<=5:i>=18))return false;
  return true;
}
function tvMoves(p,s,die){
  var sg=tvSign(s),out=[],i,to;
  if(p.bar[s]>0){
    to=s===0?24-die:die-1;
    if(p.pts[to]*sg>-2)out.push({f:-1,to:to,hit:p.pts[to]*sg===-1,die:die});
    return out;
  }
  var home=tvAllHome(p,s);
  for(i=0;i<24;i++){
    if(p.pts[i]*sg<=0)continue;
    to=s===0?i-die:i+die;
    if(to>=0&&to<=23){if(p.pts[to]*sg>-2)out.push({f:i,to:to,hit:p.pts[to]*sg===-1,die:die});}
    else if(home){
      var dist=s===0?i+1:24-i;
      if(die===dist)out.push({f:i,to:-2,hit:false,die:die});
      else if(die>dist){
        var far=false;
        for(var j=0;j<24;j++)if(p.pts[j]*sg>0&&(s===0?j>i:j<i)){far=true;break;}
        if(!far)out.push({f:i,to:-2,hit:false,die:die});
      }
    }
  }
  return out;
}
function tvApply(p,s,m){
  var q=tvCopy(p),sg=tvSign(s),o=1-s;
  if(m.f===-1)q.bar[s]--;else q.pts[m.f]-=sg;
  if(m.to===-2)q.off[s]++;
  else{
    if(m.hit){q.pts[m.to]=0;q.bar[o]++;}
    q.pts[m.to]+=sg;
  }
  return q;
}
function tvKey(p,dice){return p.pts.join(',')+'|'+p.bar.join('')+'|'+p.off.join(',')+'|'+dice.join('');}
function tvSeqs(p,s,dice){
  var seen={},res=[],maxLen=0;
  (function rec(q,rem,seq){

    if(seen[key]!==undefined&&seen[key]<=seq.length&&seq.length>0)return;seen[key]=seq.length;
    var any=false,tried={};
    for(var i=0;i<rem.length;i++){
      var d=rem[i];if(tried[d])continue;tried[d]=1;
      var mv=tvMoves(q,s,d);
      for(var k=0;k<mv.length;k++){

        var r2=rem.slice();r2.splice(i,1);
        rec(tvApply(q,s,mv[k]),r2,seq.concat([mv[k]]));

function mgFit(){
  var el=$('#mini');if(!M||el.hidden)return;
  var inn=el.querySelector('.hb-in.gm'),bd=inn&&inn.querySelector('.mg-bd,.ch-bd,.mn-bd');if(!bd)return;
  var cs=getComputedStyle(inn),vw=window.innerWidth,vh=window.innerHeight;
  var land=!!(window.matchMedia&&matchMedia('(orientation:landscape) and (max-height:600px)').matches);
  bd.style.width='200px';
  var ratio=bd.offsetHeight/200||1,w;
  var padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  if(land){w=Math.min(vh-padY-4,(vw-padX)*.56)/ratio;}
  else{
    var gap=parseFloat(cs.rowGap)||0,tot=padY,n=0;
    Array.prototype.forEach.call(inn.children,function(c){if(c!==bd){tot+=c.offsetHeight;n++;}});
    tot+=n*gap;
    w=Math.min(vw-padX,470,(vh-tot-4)/ratio);
  }
  w=Math.max(110,Math.floor(w));
  bd.style.width=w+'px';bd.style.setProperty('--bw',w+'px');
}

function mgAct(seat,kind,m){var ok=mgAct0(seat,kind,m);if(M&&M.g.type!=='jaliz'&&M.g.type!=='poker'&&M.g.type!=='tavla')stAct(seat,typeof m==='object'?m:null,ok);return ok;}
function mgAct0(seat,kind,m){
  if(M&&!M.over&&!M.wait&&M.g.type==='jaliz')return jzAct(seat,kind,m);
  if(M&&!M.over&&!M.wait&&M.g.type==='poker')return pkAct(seat,kind,m);
  if(M&&!M.over&&!M.wait&&M.g.type==='tavla')return tvAct(seat,kind,m);
  if(!M||M.over||M.wait||seat!==M.turn)return false;
  var g=M.g,ok=false;
  if(g.type==='grid'){
    if(kind!=='mv'||typeof m!=='number')return false;
    var idx=mgDrop(g,M.b,m);if(idx<0)return false;
    M.b[idx]=seat;
    var w=mgWinAt(g,M.b,idx);
    if(w){M.over=true;M.res=seat;M.line=w;M.wins[seat]++;}
    else if(M.b.indexOf(-1)<0){M.over=true;M.res='draw';}
    else M.turn=1-M.turn;
    ok=true;
  }else if(g.type==='chess'){
    if(kind!=='mv'||!m||typeof m.f!=='number'||typeof m.t!=='number')return false;
    var c=chColOf(seat),pos=chPos(),mv=null;
    chLegal(pos,c).forEach(function(q){if(q.f===m.f&&q.t===m.t&&(q.p||0)===(m.p||0))mv=q;});
    if(!mv)return false;
    var capd=pos.b[mv.t]!==0||!!mv.e;
    var np=chApply(pos,mv);
    if(capd)stAdd(seat,'cap');
    M.b=np.b;M.x={cs:np.cs,ep:np.ep,hm:np.hm,last:[mv.f,mv.t]};
    M.sel=-1;M.promo=null;
    var oc=1-c,oms=chLegal(np,oc);
    if(chInCheck(np,oc))stAdd(seat,'chk');
    if(!oms.length){
      if(chInCheck(np,oc)){M.over=true;M.res=seat;M.wins[seat]++;}
      else{M.over=true;M.res='draw';}
    }else if(np.hm>=100||chInsufficient(np.b)){M.over=true;M.res='draw';}
    else{
      M.turn=1-M.turn;
      var rk=chKey(np.b,M.turn,np.cs,np.ep);M.rep[rk]=(M.rep[rk]||0)+1;
      if(M.rep[rk]>=3){M.over=true;M.res='draw';}
    }
    ok=true;
  }else{
    if(kind==='rl')ok=mnRollFor(seat);
    else if(kind==='mv'&&typeof m==='number')ok=mnMoveFor(seat,m);
  }
  if(ok){try{if(navigator.vibrate&&M.turn===M.me)navigator.vibrate(15);}catch(e){}mgAfter();}
  return ok;
}
function mgResign(seat){

}

  if(!M||M.over||M.wait)return;

  mgAct(M.me,kind,m);
}
function mgAuto(){
  if(M&&!M.over&&!M.wait&&M.g.type==='jaliz'){jzSchedule();return;}
  if(M&&!M.over&&!M.wait&&M.g.type==='poker'){pkSchedule();return;}
  if(M&&!M.over&&!M.wait&&M.g.type==='tavla'){tvSchedule();return;}
  if(!M||M.over||M.wait||!M.ai[M.turn])return;
  var cur=M,seat=M.turn,ph=M.x&&M.x.ph,rn=M.rn;
  clearTimeout(M.t);
  M.t=setTimeout(function(){
    if(M!==cur||cur.over||cur.turn!==seat||cur.rn!==rn||!cur.ai[seat])return;
    var g=cur.g;
    if(g.type==='grid')mgAct(seat,'mv',mgAiMove(g,cur.b.slice(),seat));
    else if(g.type==='chess'){var m=chAiMove(chPos(),chColOf(seat));if(m)mgAct(seat,'mv',m);}
    else if(cur.x.ph==='roll')mgAct(seat,'rl');
    else mgAct(seat,'mv',mnAiChoose(seat));
  },g_delay());
}

  var c=t.closest('[data-c]');if(c){mgCellClick(+c.dataset.c);return;}
  var pr=t.closest('[data-pr]');
  if(pr&&M.promo){var pm=M.promo;M.promo=null;M.sel=-1;mgDo('mv',{f:pm.f,t:pm.t,p:+pr.dataset.pr});mgRender();return;}
  var s=t.closest('[data-say]');
  if(s){var j=+s.dataset.say;mgSay(j);if(M.mode==='guest'&&M.link)M.link.send({t:'say',x:j});else Object.keys(M.links).forEach(function(q){mgSend(q,{t:'say',x:j});});return;}
  var pk2=t.closest('[data-pk]');if(pk2&&(M.mode==='menu'||M.wait)){var kv=pk2.dataset.pk.split(':');M.pkcfg[kv[0]]=kv[0]==='end'?kv[1]:+kv[1];if(kv[0]==='end')M.pkcfg.lim=kv[1]==='time'?30:10;mgRender();return;}
  var tk=t.closest('[data-tk]');if(tk&&M.mode==='menu'){M.stake=+tk.dataset.tk;mgRender();return;}
  var pn=t.closest('[data-pn]');if(pn){M.pn=+pn.dataset.pn;mgRender();return;}
  var ln=t.closest('[data-ln]');
  if(ln&&M.wait){
    var nn=+ln.dataset.ln,taken=0;M.names.forEach(function(q,i){if(q&&i>0)taken++;});
    if(nn<2||nn>M.g.max||taken>nn-1){toast('بازیکنان حاضر بیشتر از این تعداد است');return;}
    while(M.names.length<nn){M.names.push('');M.wins.push(0);M.ai.push(false);}
    M.names.length=nn;M.wins.length=nn;M.ai.length=nn;M.n=nn;
    mgLob();mgRender();return;
  }
  if(t.closest('[data-bt]')){
    if(M.x&&M.x.ph==='move'&&M.turn===M.me){var bi=M.x.tok[M.me].indexOf(-1);if(bi>=0&&M.x.die===6)mgDo('mv',bi);}
    return;
  }
  var a=t.closest('[data-mg]');if(!a)return;
  var k=a.dataset.mg;
  if(k==='back'){mgClose();return;}
  if(k==='ai'){
    var g=M.g,n=g.max>2?M.pn:2;
    if(!mgEntry())return;
    var keepCfg=M.pkcfg,keepStake=M.stake;
    mgNew(g,'ai',n);M.pkcfg=keepCfg;M.stake=keepStake;M.me=0;M.names[0]=cleanName(loadName())||'تو';
    for(var i=1;i<n;i++){M.names[i]='رایانه'+(n>2?' '+fa(i):'');M.ai[i]=true;}
    if(g.type==='poker')pkNameAi();
    M.rn=0;mgReset();mgAfter();
  }
  else if(k==='mk')mgHost();
  else if(k==='join'){if(ecoCan(M.g.land?ecoNeed(M.g,M.pkcfg):ECO_FEE))mgJoin($('#mgCode').value);}
  else if(k==='start'){if(M.wait)mgBegin();}
  else if(k==='roll')mgDo('rl');
  else if(k==='resign'){
    if(M.over)return;
    if(!M.rs||Date.now()-M.rs>3500){M.rs=Date.now();a.textContent='مطمئنی؟ دوباره بزن';setTimeout(function(){if(M&&a.isConnected&&M.rs&&Date.now()-M.rs>=3400)a.textContent='تسلیم';},3600);return;}
    M.rs=0;
    if(M.mode==='guest'){M.link&&M.link.send({t:'rs'});}else mgResign(M.me);
  }
  else if(k==='inv')openPeople();
  else if(k==='copy'){try{navigator.clipboard.writeText(M.code).then(function(){toast('کد کپی شد');},function(){toast('کد: '+M.code);});}catch(x){toast('کد: '+M.code);}}
  else if(k==='rp'){if(M.rp)rpShow(M.rp,M.me);}
  else if(k==='again'){
    if(M.mode==='guest')return;
    if(!mgEntry())return;
    M.rn++;mgReset();mgAfter();
  }
});
function mgSay(j){
  if(!(j>=0&&j<MG_SAY.length)||!M)return;
  toast((M.names[M.me]||'')+': '+MG_SAY[j]);
}
